                   cycleDays:(cycOn&&cs)?Math.max(1,parseInt($("#pfCycleLen").value,10)||56):null,
                   cycleStart:(cycOn&&cs)?cs:null };
      var gapRounded=false;
      if(isNew){
        // Looks like something already known? Offer to resume that record rather
        // than start a second history for the same compound. The bar is a strong
        // match (identical, prefix or contained — "klow" inside "…(KLOW)"), not
        // mere resemblance, and it only ever asks: answering no still creates it.
        var dupe=null, best=0;
        if(DOMAIN.normName(name)) peptideList(st, true).forEach(function(o){
          var sc=DOMAIN.nameScore(name, o.name);
          if(sc>=60 && sc>best){ best=sc; dupe=o; }
        });
        if(dupe && confirm(I18N.t("pep.dupConfirm").replace("{name}", dupe.name))){
          dupe.archived=false;
          pepEditId=null; pepDraft={}; pepSel=dupe.id; injSeg="peptide";
          STORE.save(); toast(I18N.t("common.saved")); syncInjectRoute(); viewInject();
          return;
        }
        if(!st.inj.peptides) st.inj.peptides=[];
        var np=Object.assign({ id:"pep_"+uid(), archived:false, vials:[] }, fields);
        // "add" is reachable with any row open now, so land on the new peptide
        // rather than leaving whichever substance was open still selected
        st.inj.peptides.push(np); injSeg="peptide"; pepSel=np.id; p=np;
        // Nothing to freeze on a record with no history, but the rhythm still
        // goes through the one gate, so a gap that names hours lands whole.
        gapRounded=setSubstSchedule(st, np.id, fields.intervalDays, fields.days,
                                    fields.times, fields.perDay)!==fields.intervalDays;
      } else {
        // Before the assignment, never after: the freeze compares what the
        // substance is set to against what is wanted, and a record already
        // holding the new rhythm has nothing left to compare — the shots taken
        // under the old one would stay unstamped and drift with it.
        var eff=setSubstSchedule(st, p.id, fields.intervalDays, fields.days,
                                 fields.times, fields.perDay);
        gapRounded=(eff!==fields.intervalDays);
        fields.intervalDays=eff;
        Object.assign(p, fields);
      }
      // The vial log is reachable only from a deliberately opened editor. Nothing
      // else in this form — days, times, dose, name, colour — has a path to it,
      // so changing a schedule mid-cycle cannot record a reconstitution.
      // Same rule the form renders by: with no vial on file the open fields ARE
      // the first one. Keying this off `isNew` instead missed an existing
      // peptide that simply had no vial yet — its first save recorded nothing.
      var vialMode=pepDraft.vialMode || (pepVialAsOf(st, p) ? null : "new");
      if(vialMode && $("#pfVialMg") && $("#pfVialMl")){
        var vmg=parseFloat($("#pfVialMg").value), vml=parseFloat($("#pfVialMl").value);
        if(DOMAIN.vialConc(vmg, vml)!=null){
          var vd=$("#pfVialDate").value||todayISO();
          if(!p.vials) p.vials=[];
          var curV=pepVialAsOf(st, p);
          if(vialMode==="edit" && curV){
            // Correcting what is on file, not mixing again: the row keeps its id
            // and its place in the log. Shots already logged keep the units they
            // were drawn at — a reading once written is never rewritten.
            curV.date=vd; curV.mg=vmg; curV.ml=vml;
          } else {
            var prev=pepVialAsOf(st, p, vd);
            if(!prev || prev.mg!==vmg || prev.ml!==vml){
              p.vials.push({ id:"v_"+uid(), date:vd, mg:vmg, ml:vml });
              // A vial dated back before shots that were logged without one fills
              // in what they were drawn at. Only the blanks: a row that already
              // carries its own snapshot is never rewritten.
              var pid=p.id;
              (st.injLog||[]).forEach(function(e){
                if(e && e.substance===pid && e.dose!=null && e.units==null) stampDraw(st, e);
              });
            }
          }
        }
      }
      // A rounded gap is worth more than "Saved": the field is about to show a
      // number the user did not type, and this is the only place that says why.
      pepEditId=null; pepDraft={}; STORE.save();
      toast(I18N.t(gapRounded ? "inj.schedWholeDays" : "common.saved"));
      syncInjectRoute(); viewInject();
    });
    if($("#pepResume")) $("#pepResume").addEventListener("click",function(){
      var p=peptideById(st, selectedSubst()); if(!p) return;
      p.archived=false;
      STORE.save(); toast(I18N.t("common.saved")); syncInjectRoute(); viewInject();
    });
    if($("#pepDrop")) $("#pepDrop").addEventListener("click",function(){
      var id=selectedSubst(), p=peptideById(st, id); if(!p) return;
      if(!confirm(I18N.t("inj.pepDelConfirm").replace("{name}", p.name||""))) return;
      if(!deletePeptide(st, id)) return;
      STORE.save(); syncInjectRoute(); viewInject();
    });
    if($("#pfDel")) $("#pfDel").addEventListener("click",function(){
      var p=peptideById(st, pepEditId); if(!p) return;
      // Nothing on record means nothing to preserve: finishing it would be an
      // empty gesture, so a compound added by mistake simply goes. One shot
      // behind it and archiving is the only exit again — history is what
      // archiving is FOR.
      if(canDeletePep(st, p.id)){
        if(!confirm(I18N.t("inj.pepDelConfirm").replace("{name}", p.name||""))) return;
        deletePeptide(st, p.id);
        STORE.save(); syncInjectRoute(); viewInject();
        return;
      }
      if(!confirm(I18N.t("inj.pepConfirmDel"))) return;
      // With history behind it: archive, never drop. Shots keep their name and
      // colour, and the compound stays in the picker so re-adding it later
      // resumes the same record instead of starting a second history under a
      // new id.
      p.archived=true;
      if(pepSel===p.id) pepSel=null;
      pepEditId=null; pepDraft={}; STORE.save(); syncInjectRoute(); viewInject();
    });
  }
  // Tirzepatyd shares st.calc.intervalDays with the optimizer, so the card and
  // the calculator can never disagree about how often the shot is due.
  // The Mounjaro tab can be switched off in settings: its data and maths stay
  // untouched, only the entry points disappear (the shots live on as Tirzepatyd).
  function mjTabOn(st){ return st.settings.showMounjaroTab!==false; }
  function pepInterval(st, p){
    if(p && p.id==="mounjaro") return parseEvery(st.calc.intervalDays,7);
    return parseEvery(p?p.intervalDays:1, 1);
  }
  function setPepInterval(st, p, v){
    if(p && p.id==="mounjaro") st.calc.intervalDays=v; else p.intervalDays=v;
  }
  // A substance is on a weekday plan when it has a valid day set. Mounjaro is
  // deliberately excluded: its interval is the same number the optimizer plans
  // pens, clicks and costs from, and a weekday plan has no single number to give.
  function pepDays(st, p){
    if(!p || p.id==="mounjaro") return null;
    return DOMAIN.normDays(p.days);
  }
  function substDays(st, sub){
    var p=peptideById(st, sub);
    if(p) return pepDays(st, p);
    if(sub==="trt") return DOMAIN.normDays(st.inj.trt.days);
    return null;
  }
  // Hours say WHEN on the days the rhythm already picked out — and both rhythms
  // pick days out, so "every 2 days at 20:00" is as legitimate as "Tue/Thu at
  // 20:00". Only Tirzepatyd has nowhere to keep them: it rides st.calc.
  function substTimes(st, sub){
    if(!canPickDays(st, sub)) return null;
    var p=peptideById(st, sub);
    if(p) return p.id==="mounjaro" ? null : DOMAIN.normTimes(p.times);
    if(sub==="trt") return DOMAIN.normTimes(st.inj.trt.times);
    return null;
  }
  function pepTimes(st, p){ return p?substTimes(st, p.id):null; }
  // Unlike the hours, the count needs no weekday plan: "every 2 days, twice a
  // day" is as legitimate as "daily, twice a day".
  function substPerDay(st, sub){
    if(!canPickDays(st, sub)) return 1;
    var p=peptideById(st, sub);
    if(p) return DOMAIN.normPerDay(p.perDay);
    if(sub==="trt") return DOMAIN.normPerDay(st.inj.trt.perDay);
    return 1;
  }
  function pepPerDay(st, p){ return p?substPerDay(st, p.id):1; }
  function canPickDays(st, sub){ return sub==="trt" || !!(peptideById(st, sub) && sub!=="mounjaro"); }
  // A cadence change must never rewrite what already happened. Shots logged
  // before intervals were stamped carry no `every` of their own, so stamp them
  // with the value that was in force right up to this moment — then the new one
  // applies from here on and history can no longer shift under them.
  function freezeInterval(st, sub){
    var dys=substDays(st, sub), tms=substTimes(st, sub), ev=substInterval(st, sub);
    var pd=substPerDay(st, sub);
    if(!dys && ev==null) return 0;
    var n=0;
    (st.injLog||[]).forEach(function(e){
      if(!e || e.substance!==sub) return;
      if(e.every!=null || DOMAIN.normDays(e.days)) return;   // already speaks for itself
      if(dys) e.days=dys.slice();
      else e.every=ev;
      if(tms) e.times=tms.slice();
      if(pd>1) e.perDay=pd;
      n++;
    });
    return n;
  }
  // The one way to change a substance's cadence, wherever the field lives
  // (st.calc for Tirzepatyd, st.inj.trt for TRT, the peptide itself otherwise).
  // Freezes first, and only on a real change — re-saving the same number must
  // not stamp anything.
  function setSubstInterval(st, sub, v){
    if(v==null) return;
    setSubstSchedule(st, sub, v, null);
  }
  // Both halves of a cadence in one place. `days` non-empty puts the substance
  // on a weekday plan and the number becomes a leftover the plan overrides;
  // null days puts it back on a fixed gap. Freezes first, and only on a real
  // change — re-saving the same rhythm must not stamp anything.
  // `times` left out entirely means "leave the hours as they are" (so editing
  // the number of days cannot silently drop them); an explicit null clears them.
  function setSubstSchedule(st, sub, v, days, times, perDay){
    var want=DOMAIN.normDays(days);
    var wantT=(times===undefined)?substTimes(st, sub):DOMAIN.normTimes(times);
    // An hour pins the dose to the clock, so a gap that names hours counts in
    // whole days. Rounded at the one gate every cadence change passes through,
    // and said out loud — a typed 3,5 must never quietly become something else.
    if(v!=null && !want && wantT){
      var whole=Math.max(1, Math.round(v));
      if(whole!==v){ v=whole; toast(I18N.t("inj.schedWholeDays")); }
    }
    var wantP=(perDay==null)?substPerDay(st, sub):DOMAIN.normPerDay(perDay);
    var wantKey=DOMAIN.cadenceKey({ days:want, times:wantT, every:v, perDay:wantP });
    var haveKey=DOMAIN.cadenceKey({ days:substDays(st, sub), times:substTimes(st, sub),
                                    every:substInterval(st, sub), perDay:substPerDay(st, sub) });
    if(wantKey!==haveKey) freezeInterval(st, sub);
    var p=peptideById(st, sub);
    if(v!=null){
      if(p) setPepInterval(st, p, v);
      else if(sub==="trt") st.inj.trt.intervalDays=v;
      else if(sub==="mounjaro") st.calc.intervalDays=v;
    }
    if(!canPickDays(st, sub)) return v;
    var tgt = p || (sub==="trt" ? st.inj.trt : null);
    if(!tgt) return v;
    tgt.days=want?want.slice():null;
    tgt.times=wantT?wantT.slice():null;
    tgt.perDay=wantP;
    return v;                       // the gap as actually stored, rounding included
  }
  // ---- reconstitution: vials, concentration and units to draw ----
  function pepVials(st, p){ return (p && p.vials) || []; }
  function pepVialAsOf(st, p, dISO){ return DOMAIN.vialAsOf(pepVials(st,p), dISO || todayISO()); }
  function pepConcAsOf(st, p, dISO){
    var v=pepVialAsOf(st, p, dISO);
    return v ? DOMAIN.vialConc(v.mg, v.ml) : null;
  }
  // Units to draw for a dose, measured against the vial open on that date.
  function pepUnits(st, p, dose, dISO){
    if(!p) return null;
    return DOMAIN.unitsForDose(dose, p.unit, pepConcAsOf(st, p, dISO));
  }
  // Freeze onto the entry what was actually drawn, at the concentration of its
  // own day. Every write of a dose or a date goes through here, so a later vial
  // never rewrites an old row and an edited row never keeps a stale number. No
  // vial covering that day means no figure at all — a missing value must not
  // masquerade as a real one.
  function stampDraw(st, entry){
    if(!entry) return entry;
    var p=peptideById(st, entry.substance);
    var conc=p?pepConcAsOf(st, p, entry.date):null;
    var u=p?DOMAIN.unitsForDose(entry.dose, p.unit, conc):null;
    if(u!=null){ entry.units=Math.round(u*10)/10; entry.mgPerMl=Math.round(conc*1000)/1000; }
    else { delete entry.units; delete entry.mgPerMl; }
    return entry;
  }
  function fmtUnits(u){
    if(u==null) return "";
    var r=Math.round(u*10)/10, t=String(r);
    return I18N.lang==="pl" ? t.replace(".",",") : t;
  }
  function fmtConc(c){
    if(c==null) return "";
    var r=Math.round(c*100)/100, t=String(r);
    return I18N.lang==="pl" ? t.replace(".",",") : t;
  }
  function nextPepTone(st){
    var used={};
    peptideList(st, true).forEach(function(p){ if(p.tone) used[p.tone]=true; });
    for(var i=0;i<PEP_TONES.length;i++){ if(!used[PEP_TONES[i]]) return PEP_TONES[i]; }
    return PEP_TONES[peptideList(st,true).length % PEP_TONES.length];
  }

  // Compact substance-coloured dose pills (MJ/TRT) in effect on a given date,
  // shared by the BP and weight histories. Each pill ends with the therapy
  // week on that substance as of that date ("t5"), styled exactly like the
  // rest of the pill text. manualMg is a legacy, manually entered Mounjaro
  // dose shown only when no injection data covers the date.
  // dose text with the injection interval when the entry carries one:
  // "25 mg/2d" = 25 mg per shot, every 2 days (language-neutral notation)
  // A weekday plan has no single gap to quote, so it names the days instead —
  // the same short labels the weekday chips beside dates already use.
  function fmtDows(days){
    var n=DOMAIN.normDays(days);
    if(!n) return "";
    // All seven is not a list worth reading — it is simply every day.
    if(n.length===7) return I18N.t("inj.schedAllDays");
    return n.map(function(d){ return I18N.t("common.dow"+d); }).join("\u00b7");
  }
  function fmtTimes(times){
    var t=DOMAIN.normTimes(times);
    return t ? t.join("\u00b7") : "";
  }
  // Seven toggles, Monday first. The selection lives in the DOM (and in the
  // caller's draft) so a re-render of the surrounding form cannot drop it.
  function dowPickHTML(id, sel){
    var n=DOMAIN.normDays(sel)||[], out='<div class="dowpick" id="'+esc(id)+'">';
    for(var d=1;d<=7;d++){
      var on=n.indexOf(d)>=0;
      out+='<button type="button" class="dowchip'+(on?" on":"")+'" data-dow="'+d+'"'
        +' aria-pressed="'+(on?"true":"false")+'">'+esc(I18N.t("common.dow"+d))+'</button>';
    }
    return out+'</div>';
  }
  function readDowPick(id){
    var out=[];
    $all("#"+id+" .dowchip.on").forEach(function(b){ out.push(Number(b.getAttribute("data-dow"))); });
    return DOMAIN.normDays(out);
  }
  function bindDowPick(id, onChange){
    var box=$("#"+id); if(!box) return;
    $all("#"+id+" .dowchip").forEach(function(b){
      b.addEventListener("click",function(){
        var on=!b.classList.contains("on");
        // A plan needs at least one day: turning off the last one would leave a
        // rhythm with nothing to count down to, so it stays on and says why.
        if(!on && (readDowPick(id)||[]).length<2){ toast(I18N.t("inj.schedNone")); return; }
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on?"true":"false");
        if(onChange) onChange(readDowPick(id));
      });
    });
  }
  // Doses per injection day, as a count. Offered in BOTH rhythms — "every 2 days,
  // twice a day" is as legitimate a protocol as "daily, twice a day".
  function perDayHTML(id, sel){
    var n=DOMAIN.normPerDay(sel), out='<select id="'+esc(id)+'">';
    for(var i=1;i<=DOMAIN.PER_DAY_MAX;i++)
      out+='<option value="'+i+'"'+(i===n?" selected":"")+'>'+i+"\u00d7"+'</option>';
    return out+'</select>';
  }
  var TIMES_MAX=6;
  // One row per time of day. Kept in the DOM like the weekday chips, so the
  // surrounding form can re-render without losing an unsaved edit.
  function timePickHTML(id, sel){
    var t=DOMAIN.normTimes(sel)||[], out='<div class="timepick" id="'+esc(id)+'">';
    t.forEach(function(v){
      out+='<div class="timerow"><input type="time" class="timeval" value="'+esc(v)+'">'
        +'<button type="button" class="btn ghost sm timedel" aria-label="'+esc(I18N.t("common.delete"))+'">'
        +icon("trash")+'</button></div>';
    });
    out+='<button type="button" class="btn ghost sm timeadd">'+esc(I18N.t("inj.schedTimeAdd"))+'</button>';
    return out+'</div>';
  }
  function readTimePick(id){
    var out=[];
    $all("#"+id+" .timeval").forEach(function(i){ if(i.value) out.push(i.value); });
    return DOMAIN.normTimes(out);
  }
  function bindTimePick(id, onChange){
    var box=$("#"+id); if(!box) return;
    function fire(){ if(onChange) onChange(readTimePick(id)); }
    $all("#"+id+" .timeval").forEach(function(i){ i.addEventListener("change", fire); });
    $all("#"+id+" .timedel").forEach(function(b){
      b.addEventListener("click",function(){ b.parentNode.parentNode.removeChild(b.parentNode); fire(); });
    });
    var add=box.querySelector(".timeadd");
    if(add) add.addEventListener("click",function(){
      if($all("#"+id+" .timeval").length>=TIMES_MAX){ toast(I18N.t("inj.schedTimeMax")); return; }
      var row=document.createElement("div");
      row.className="timerow";
      row.innerHTML='<input type="time" class="timeval" value="'+esc(nextFreeTime(readTimePick(id)))+'">'
        +'<button type="button" class="btn ghost sm timedel" aria-label="'+esc(I18N.t("common.delete"))+'">'+icon("trash")+'</button>';
      box.insertBefore(row, add);
      row.querySelector(".timeval").addEventListener("change", fire);
      row.querySelector(".timedel").addEventListener("click",function(){ box.removeChild(row); fire(); });
      fire();
    });
  }
  // A sensible hour for a new row rather than a blank field: morning first,
  // then twelve hours on, then whatever slot is still free.
  function nextFreeTime(cur){
    var have={}; (cur||[]).forEach(function(t){ have[t]=true; });
    var pick=["08:00","20:00","12:00","16:00","22:00","06:00"];
    for(var i=0;i<pick.length;i++) if(!have[pick[i]]) return pick[i];
    return "10:00";
  }
  function doseTxt(dose, unit, every, days, times, perDay){
    var d=fmtDows(days), t=fmtTimes(times);
    // Named hours already say how many a day, so the count is not repeated.
    var n=DOMAIN.normPerDay(perDay), px=(n>1 && !t)?" "+n+"\u00d7":"";
    if(d && t) return dose+" "+unit+" "+(DOMAIN.normDays(days).length===7?"":d+" ")+t;
    if(d) return dose+" "+unit+" "+d+px;
    return dose+" "+unit+(every!=null?"/"+fmtEvery(every)+"d":"")+(t?" "+t:"")+px;
  }
  function dosePill(label, txt, color, week, doseWeek){
    return '<span class="pill dosepill" style="background:'+color+PAL.tintA+';color:'+color+'">'+(label?label+' ':'')+esc(txt)
      +(week!=null?' '+esc(I18N.t("common.weekLetter"))+week:'')
      +(doseWeek!=null?' &middot; '+esc(I18N.t("common.doseWeekLetter"))+doseWeek:'')+'</span>';
  }
  // Tiny weekday chip ("pt"/"Fr") shown next to dates in the injection and BP
  // histories; tooltip carries the full weekday name.
  function dowBadge(dISO){
    if(!dISO) return "";
    var full=""; try{ full=new Date(dISO+"T12:00:00").toLocaleDateString(I18N.lang==="en"?"en-GB":"pl-PL",{weekday:"long"}); }catch(e){}
    return '<span class="pill minipill" title="'+esc(full)+'">'+esc(I18N.t("common.dow"+DOMAIN.dowIndex(dISO)))+'</span>';
  }
  // Injection-day marker: a small syringe per substance injected on that date,
  // shown next to dates in the weight/BP/diary histories so shot days stand
  // out at a glance. Legacy jab.history dates count as Mounjaro.
  // When the reading's own timestamp (measTs) is known and falls before that
  // substance's first shot of the day, the syringe renders dimmed: the day is
  // still marked, but the reading predates the shot (e.g. fasting morning BP).
  // No timestamp on either side -> full marker (we don't guess the order).
  function injDayMarkers(st, dISO, measTs){
    // Syringe indicator hidden for now — injection/weight correlation will be
    // surfaced later in a dedicated analysis view. Return "" to suppress the
    // markers everywhere without removing the (still-used) machinery below.
    return "";
    var subs=[], firstTs={};
    (st.injLog||[]).forEach(function(e){
      if(!e || e.date!==dISO) return;
      if(subs.indexOf(e.substance)<0) subs.push(e.substance);
      if(e.ts && (!firstTs[e.substance] || e.ts<firstTs[e.substance])) firstTs[e.substance]=e.ts;
    });
    if(subs.indexOf("mounjaro")<0 && st.jab && (st.jab.history||[]).indexOf(dISO)>=0) subs.push("mounjaro");
    if(!subs.length) return "";
    return subs.map(function(sub){
      var pre = !!(measTs && firstTs[sub] && String(measTs)<firstTs[sub]);
      return '<span class="injmark'+(pre?' pre':'')+'" title="'+esc(I18N.t("inj.seg."+sub))+(pre?' · '+esc(I18N.t("inj.markPre")):'')+'" style="color:'+substColor(st, sub)+'">'+icon("inject")+'</span>';
    }).join('');
  }
  // same markers on their own line (for narrow date columns in history tables)
  function injDayMarkersBlock(st, dISO, measTs){
    var m=injDayMarkers(st, dISO, measTs);
    return m ? '<div class="daymarks">'+m+'</div>' : '';
  }

  // single-substance pill for "now": "2.5 mg t5 · d5" (no label — context names it)
  // The configured cadence for any substance. Entries logged before intervals
  // were stamped carry no `every`, so a pill would read "2.5 mg" with no idea
  // how often — fall back to what the substance is actually set to.
  function substInterval(st, sub){
    var p=peptideById(st, sub);
    if(p) return pepInterval(st, p);
    if(sub==="mounjaro") return parseEvery(st.calc.intervalDays,7);
    if(sub==="trt") return parseEvery(st.inj.trt.intervalDays,3);
    return null;
  }
  // The only pill allowed to fall back to the configured cadence: it speaks for
  // today, and today's cadence is exactly what the substance is set to. Anywhere
  // a past day is shown the shot must speak for itself, or say nothing.
  function nowDosePill(st, sub, todayISOstr){
    var ld=DOMAIN.lastDoseAsOf(st, sub, todayISOstr); if(!ld) return "";
    var w=DOMAIN.therapyWeek(DOMAIN.firstInjDateFor(st,sub), todayISOstr);
    var dys=ld.days || substDays(st, sub);
    // An entry carrying a cadence of its own speaks for itself, hours included:
    // a shot stamped "every 2 days" and nothing else had no hour, and must not
    // borrow today's.
    var tms=(ld.days || ld.every!=null) ? ld.times : substTimes(st, sub);

  function lastInjDate(st, substance){

  // Millisecond timestamp of the last shot, so a fractional interval can be

  // jab.history dates) fall back to noon, the convention used everywhere else.
  // A jab.history date is only considered when injLog has nothing that day —
  // otherwise its noon would beat a real 08:00 shot and skew the countdown.
  // Doses of one substance on the LOCAL calendar day of `lastMs`, and when the
  // first of them was. Deliberately the day of the last shot, not today's: at
  // 03:00 yesterday's quota is already spent, so the next dose belongs to the
  // morning rather than to this minute.
  function substDayCtx(st, sub, lastMs){
    var ctx={ perDay:substPerDay(st, sub), dayCount:0, firstMs:null };
    if(lastMs==null) return ctx;
    var d=new Date(lastMs), y=d.getFullYear(), m=d.getMonth(), dd=d.getDate();
    DOMAIN.visibleInjLog(st).forEach(function(e){
      if(!e || e.substance!==sub) return;
      var t=Date.parse(e.ts || (e.date+"T12:00:00"));
      if(isNaN(t)) return;
      var x=new Date(t);
      if(x.getFullYear()!==y || x.getMonth()!==m || x.getDate()!==dd) return;
      ctx.dayCount++;
      if(ctx.firstMs==null || t<ctx.firstMs) ctx.firstMs=t;
    });
    return ctx;
  }
  function lastInjTs(st, substance){
    var best=null, seen={};
    function consider(t){ if(!isNaN(t) && (best===null || t>best)) best=t; }
    DOMAIN.visibleInjLog(st).forEach(function(e){
      if(e.substance!==substance) return;
      seen[e.date]=true;
      consider(Date.parse(e.ts || (e.date+"T12:00:00")));
    });
    if(substance==="mounjaro" && st.jab && st.jab.history){
      st.jab.history.forEach(function(d){ if(!seen[d]) consider(Date.parse(d+"T12:00:00")); });

      if(cur && nextPenS!==curS){
        html+='<div class="warnbox" style="margin:-4px 0 10px">'+esc(I18N.t("trk.strengthPending").replace("{old}",fmtNum(curS,(curS%1)?1:0)).replace("{new}",fmtNum(nextPenS,(nextPenS%1)?1:0)))+'</div>';
      } else if(done>0 || trkHasChanges(pt)){
        html+='<p class="tiny muted" style="margin:-4px 0 10px">'+esc(I18N.t("trk.strengthHint"))+'</p>';
      }
      html+='<div class="field" style="max-width:240px"><label>'+esc(I18N.t("trk.dose"))+'</label><input type="number" inputmode="decimal" step="0.25" id="ptDose" value="'+(doseNow!=null?doseNow:"")+'"></div>';
      var dPend=(pt.doseChanges||[]).filter(function(e){return e.fromShot===done;});
      if(dPend.length){
        var dpv=dPend[dPend.length-1].dose;
        html+='<p class="tiny" style="margin:-4px 0 10px;color:'+PAL.sbInk+'">'+esc(I18N.t("trk.dosePending").replace("{new}",fmtNum(dpv,(dpv%1)?2:0)))+'</p>';
      }
      if(!cur){
        html+='<div class="note">'+esc(I18N.t("trk.badDose"))+'</div>';
      } else {
        var sh=cur.sh, off=cur.off;
        var mixed = sh.newPenS!=null && sh.newPenS!==sh.penS;
        html+='<p class="tiny muted" style="margin:0 0 10px">'+esc(clickEqText(sh.penS))
          +(mixed?'<br>'+esc(clickEqText(sh.newPenS))+' — '+esc(I18N.t("trk.pen"))+' '+(sh.penNoNew+off):'')+'</p>';
        // pen state going INTO this shot (a drained pen was already swapped)
        var pen0=DOMAIN.CLICKS_PER_PEN, gold0=DOMAIN.GOLDEN_UNITS;
        if(done>0){
          var prev=trkShotAt(ps, done-1);
          pen0=prev.sh.penLeftAfter; gold0=prev.sh.goldenLeftAfter;
          if(pen0===0 && gold0===0){ pen0=DOMAIN.CLICKS_PER_PEN; gold0=DOMAIN.GOLDEN_UNITS; }
        }
        html+='<div style="border:2px solid '+PAL.brand+';border-radius:14px;padding:12px">'
          +'<div class="tiny" style="text-transform:uppercase;letter-spacing:.6px;color:'+PAL.brand+';font-weight:700">'
            +esc(I18N.t("trk.now").replace("{n}",done+1))+' · '+esc(I18N.t("trk.pen"))+' '+(sh.penNo+off)+' ('+esc(mgLbl(sh.penS))+')</div>'
          +'<div class="row" style="gap:6px;margin-top:8px">'+trkParts(sh,off)+'</div>'
          +'<div class="tiny muted" style="margin-top:6px">= '+fmtNum(sh.mg,2)+' mg</div>'
        +'</div>';
        html+=penBarHTML(pen0, gold0);
        html+='<div class="tiny muted" style="margin:0 0 4px">'+esc(I18N.t("trk.beforeDose").replace("{n}",done+1))+': <b style="color:var(--ink)">'+pen0+' '+esc(I18N.t("common.clicks"))+'</b> + <b style="color:'+PAL.sbInk+'">'+esc(I18N.t("trk.golden"))+' '+gold0+' '+esc(I18N.t("sch.units"))+'</b></div>';
        var nx='';
        for(var k=done+1;k<=done+3;k++){
          var it=trkShotAt(ps,k); if(!it.sh) break;
          nx+='<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line)">'
            +'<span class="muted tiny" style="flex:0 0 36px">#'+(k+1)+'</span>'
            +'<span class="small">'+trkCompact(it.sh,it.off)
              +' <span class="muted tiny">· '+esc(I18N.t("trk.willLeave"))+' '+it.sh.penLeftAfter+' '+esc(I18N.t("trk.clicksShort"))+' + '+it.sh.goldenLeftAfter+' '+esc(I18N.t("sch.units"))+'</span></span></div>';
        }
        if(nx) html+='<div style="margin-top:10px"><div class="tiny muted" style="font-weight:600;margin-bottom:2px">'+esc(I18N.t("trk.next"))+'</div>'+nx+'</div>';
        html+='<div class="row" style="align-items:center;gap:10px;margin-top:12px">'
          +'<span class="small"><b>'+done+'</b> '+esc(I18N.t("trk.done"))+' <span class="muted tiny">('+esc(I18N.t("trk.fromLog"))+')</span></span>'
          +'<button class="btn ghost sm" id="ptReset">'+esc(I18N.t("trk.reset"))+'</button>'
        +'</div>';
        html+='<div class="field" style="max-width:260px;margin-top:10px"><label>'+esc(I18N.t("trk.preDone"))+'</label>'
          +'<input type="number" inputmode="numeric" min="0" id="ptPre" value="'+(pt.preDone||0)+'">'
          +'<div class="tiny muted" style="margin-top:4px">'+esc(I18N.t("trk.preDoneHint"))+'</div></div>';
        html+='<p class="tiny muted" style="margin:8px 0 0">'+esc(I18N.t("trk.hint"))+'</p>';
        html+='<div class="rellinks" style="margin-top:10px"><a class="btn ghost" href="#optimizer">'+icon("calc")+esc(I18N.t("rel.toCalc"))+icon("arrow")+'</a></div>';
      }
    }
    html+='</div>';
    return html;
  }

  function viewInject(){
    var st=s(), today=todayISO();
    // tab off: Mounjaro is not a row of its own, Tirzepatyd is just a peptide
    if(injSeg==="mounjaro" && !mjTabOn(st)) injSeg="peptide";
    var editing=null;
    if(injEdit){
      if(injEdit.indexOf("jab:")===0){   // legacy Mounjaro date with no injLog entry yet
        editing={ id:injEdit, date:injEdit.slice(4), substance:"mounjaro", dose:null, unit:"mg", site:null, jabOnly:true };
        injSeg="mounjaro";
      } else {
        for(var ei=0;ei<st.injLog.length;ei++){ if(st.injLog[ei].id===injEdit){ editing=st.injLog[ei]; break; } }
        if(editing){
          // a peptide id is not a segment: keep the switch valid and open that card
          if(peptideById(st, editing.substance)){ injSeg="peptide"; pepSel=editing.substance; }
          else injSeg=editing.substance;
        } else injEdit=null;
      }
    }
    // Everything below (form, history, save) acts on ONE substance. For peptides
    // that is the selected card, so `sub` is null until one is picked.
    if(injSeg==="peptide" && pepSel && !peptideById(st, pepSel)) pepSel=null;
    var sub = selectedSubst();

    var html=pageHead("inj.title");

    // ---- one list for everything; tapping a row opens it below ----
    html+='<div class="card">'
      +(injReorder?'<p class="sub" style="margin:0 0 8px">'+esc(I18N.t("inj.dragHint"))+'</p>':'')
      +'<div class="peplist'+(injReorder?" reord":"")+'">'+substRows(st).map(function(id){ return substCardHTML(st, id); }).join("")+'</div>';
    if(injReorder){
      html+='<div class="row" style="margin-top:10px"><button class="btn" id="reordDone" style="width:100%">'
        +esc(I18N.t("inj.reorderDone"))+'</button></div>';
    } else if(!pepEditId){
      html+='<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="pepAdd" style="flex:1">+ '
        +esc(I18N.t("inj.pepAdd"))+'</button>'
        +(substRows(st).length>1?'<button class="btn ghost sm" id="reordStart">'+esc(I18N.t("inj.reorder"))+'</button>':'')
        +'</div>';
    }
    html+='</div>';

    // ---- finished compounds: folded away, one tap from their history ----
    // Out of the reordered list on purpose, so dragging never has to reckon with
    // rows that are not part of the running order.
    var arch=archivedRows(st);
    if(arch.length && !injReorder){
      html+='<details class="card"'+(arch.indexOf(sub)>=0?' open':'')+'>'
        +'<summary style="cursor:pointer;font-weight:700">'
        +esc(I18N.t("inj.archivedTitle").replace("{n}", String(arch.length)))+'</summary>'
        +'<div class="peplist archlist" style="margin-top:10px">'
        +arch.map(function(id){ return substCardHTML(st, id); }).join("")+'</div></details>';
    }

    // ---- rhythm extras for whichever row is open ----
    // The card above already carries the bar and the countdown, so what is left
    // is the cadence TRT and Mounjaro let you edit in place, plus the interval
    // repair panel — which any substance can need, peptides included.
    var extras="";
    if(injSeg==="mounjaro"){
      var every=parseEvery(st.calc.intervalDays,7);
      var mjCd=DOMAIN.doseCountdown(lastInjTs(st,"mounjaro"), every, Date.now());
      if(mjCd){
        extras+=ringSVG(mjCd.overdue?1:mjCd.frac, countdownBig(mjCd), countdownText(mjCd), fmtNextShot(mjCd.nextMs));
      } else {
        extras+='<div class="empty">'+esc(I18N.t("jab.firstHint"))+'</div>';
      }
      extras+='<div class="field" style="max-width:220px;margin:8px auto 0"><label>'+esc(I18N.t("inj.intervalSet"))+'</label><input type="number" inputmode="decimal" id="mjEvery" min="0.5" step="0.5" value="'+every+'"></div>';
    } else if(injSeg==="trt"){
      var trtDys=substDays(st,"trt");
      extras+='<div class="grid g2">'
        +'<div class="field"><label>'+esc(I18N.t("inj.schedMode"))+'</label><select id="trtMode">'
        +'<option value="every"'+(trtDys?"":" selected")+'>'+esc(I18N.t("inj.schedEvery"))+'</option>'
        +'<option value="days"'+(trtDys?" selected":"")+'>'+esc(I18N.t("inj.schedDays"))+'</option>'
        +'</select></div>'
        +'<div class="field"><label>'+esc(I18N.t("inj.perDay"))+'</label>'+perDayHTML("trtPerDay", substPerDay(st,"trt"))+'</div>'
        +'</div>';
      extras+='<p class="tiny muted" style="margin:-4px 0 8px">'+esc(I18N.t("inj.perDayHint"))+'</p>';
      if(trtDys) extras+='<div class="field"><label>'+esc(I18N.t("inj.schedPick"))+'</label>'+dowPickHTML("trtDays", trtDys)
        +'<button type="button" class="btn ghost sm" id="trtAllDays" style="margin-top:6px">'+esc(I18N.t("inj.schedEveryDay"))+'</button></div>';
      else extras+='<div class="field" style="max-width:220px"><label>'+esc(I18N.t("inj.intervalSet"))+'</label><input type="number" inputmode="decimal" id="trtEvery" min="0.5" step="0.5" value="'+parseEvery(st.inj.trt.intervalDays,3)+'"></div>';
      // The hours ride either rhythm, so the field stands outside the branch.
      extras+='<div class="field"><label>'+esc(I18N.t("inj.schedTimes"))+'</label>'+timePickHTML("trtTimes", substTimes(st,"trt"))+'</div>';
    }
    // retro-stamp a date range with its real interval: a shot logged before
    // cadences were stamped carries none of its own and shows a bare dose, and
    // the d counter can only reset where the data says the schedule changed.
    // Overwrites, so a wrong stamp can be re-applied. Off unless switched on in
    // settings: it is a one-off repair, and it was taking up half the screen on
    // every visit. Still auto-expands, once shown, while a dosed shot of this
    // substance lacks an interval.
    if(sub && st.settings.showDoseBackfill){
      var bfPending=(st.injLog||[]).some(function(e){ return e && e.substance===sub && e.dose!=null && e.every==null; });
      extras+='<details class="note" style="margin-top:10px"'+(bfPending?' open':'')+'><summary style="cursor:pointer;font-weight:700">'+esc(I18N.t("inj.backfillTitle"))+'</summary>'
        +'<p class="sub">'+esc(I18N.t("inj.backfillSub"))+'</p>'
        +'<div class="grid g3">'
        +'<div class="field"><label>'+esc(I18N.t("inj.backfillFrom"))+'</label><input type="date" id="bfFrom"></div>'
        +'<div class="field"><label>'+esc(I18N.t("inj.backfillTo"))+'</label><input type="date" id="bfTo"></div>'
        +'<div class="field"><label>'+esc(I18N.t("inj.intervalSet"))+'</label><input type="number" inputmode="decimal" id="bfEvery" min="0.5" step="0.5" value="'+substInterval(st, sub)+'"></div>'
        +'</div>'
        +'<button class="btn ghost sm" id="bfApply">'+esc(I18N.t("inj.backfillApply"))+'</button></details>';
    }
    if(sub && !pepEditId && extras) html+='<div class="card">'+extras+'</div>';

    if(pepEditId) html+=pepFormHTML(st);
    if(pepPickOpen && pepEditId) html+=pepPickHTML(st, pepDraft.pick||"");
    // The logging form and history act on one substance. With the peptide
    // settings open, or no peptide picked yet, the card list is the whole screen.
    var showForm = !pepEditId && !!sub;
    var subP=peptideById(st, sub), subArch=!!(subP && subP.archived);
    // A finished compound is a record to read, not a place to log: its history
    // and the repair panel stay, the dose form steps out, and one button puts it
    // back on the list.
    if(showForm && subArch){
      var subShots=substShotCount(st, sub);
      html+='<div class="card"><p class="sub" style="margin:0 0 10px">'+esc(I18N.t("inj.archivedNote"))+'</p>'
        +'<div class="row"><button class="btn" id="pepResume">'+esc(I18N.t("inj.pepResume"))+'</button>'
        +'<a class="btn ghost" href="#diary">'+icon("diary")+esc(I18N.t("rel.toDiary"))+icon("arrow")+'</a>'
        +(canDeletePep(st, sub)?'<button class="btn ghost" id="pepDrop">'+esc(I18N.t("inj.pepDeleteFinal"))+'</button>':'')
        +'</div>'
        // A button that is simply absent sends the reader hunting for it. The
        // count says why it is not here, and points at the only way out: the
        // shots go one by one from the history, or the compound stays.
        +(subShots?'<p class="tiny muted" style="margin:8px 0 0">'
          +esc(I18N.t("inj.pepKeepsShots").replace("{n}", String(subShots)))+'</p>':'')
        +'</div>';
    }
    if(showForm && !subArch){
    html+='<div class="card">';
    // ---- dose + body map + log/update ----
    if(editing) html+='<div class="note" style="margin-bottom:10px">'+esc(I18N.t("inj.editing"))+'</div>';
    var pepCur=peptideById(st, sub);
    var unit=pepCur?pepCur.unit:(sub==="peptide"?I18N.t("inj.unitsUnit"):I18N.t("inj.mgUnit"));
    var dosePh=(sub==="mounjaro"&&st.calc.strengthMg!=null)?st.calc.strengthMg:(pepCur?"":"");
    // default the dose to the previous shot of this substance for one-tap logging
    var lastD=DOMAIN.lastDoseAsOf(st, sub);
    var doseVal=editing?(editing.dose!=null?editing.dose:""):(injDraft.dose||(lastD?lastD.dose:""));
    html+='<div class="field"><label>'+esc(I18N.t("inj.dose"))+' ('+esc(unit)+') <span class="muted tiny">('+esc(I18N.t("common.optional"))+')</span></label>'
      +'<input type="number" inputmode="decimal" step="0.1" id="injDose" value="'+esc(String(doseVal))+'" placeholder="'+esc(String(dosePh))+'"></div>';
    // how much to draw on a U-100 syringe, recomputed live as the dose is typed
    if(pepCur) html+='<div id="pepDraw">'+drawBoxHTML(st, pepCur, doseVal)+'</div>';
    // when given: captured as "now" by default, editable to backfill (parity with BP)
    function tsToLocal(ts){ var d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
    var whenVal = injDraft.when || (editing ? (editing.ts ? tsToLocal(editing.ts) : (editing.date?editing.date+"T12:00":nowLocalDT())) : nowLocalDT());
    html+='<div class="grid g2"><div class="field"><label>'+esc(I18N.t("inj.when"))+' <span class="muted tiny">('+esc(I18N.t("inj.whenHint"))+')</span></label>'
      +'<input type="date" id="injDate" value="'+esc(whenVal.slice(0,10))+'"></div>'
      +'<div class="field"><label>'+esc(I18N.t("common.time"))+'</label><input type="time" id="injTime" value="'+esc(whenVal.slice(11,16))+'"></div></div>';
    var selForMap = injSel || (editing ? (editing.pos || (editing.site&&LEGACY_SITE_CM[editing.site]) || null) : null);
    html+='<p class="sub" style="margin-bottom:0">'+esc(I18N.t("inj.pickSite"))+'</p>';
    html+=bellyMapSVG(st, selForMap, true);
    var shownPos = selForMap || DOMAIN.suggestSpot(recentSpots(st));
    if(shownPos){
      html+='<div class="center small muted">'+esc(I18N.t("inj.selected"))+': <b style="color:var(--ink)">'+esc(posLabel(shownPos))+'</b>'
        +(!selForMap?' <span class="muted tiny">('+esc(I18N.t("inj.suggested"))+')</span>':'')+'</div>';
    }
    html+='<div class="center tiny muted" style="margin-top:4px">'+esc(I18N.t("inj.mapHint"))+'</div>';
    // sandbagging flag (TRT only, and only while the setting is on)
    if(injSeg==="trt" && st.settings.sandbagging){
      var sbChecked = injDraft.sandbag!=null ? injDraft.sandbag : (editing ? !!editing.sandbag : false);
      html+='<label class="toggle" style="margin-top:10px"><input type="checkbox" id="injSandbag"'+(sbChecked?" checked":"")+'><span class="switch"></span><span>'+esc(I18N.t("inj.sandbag"))+'</span></label>';
    }
    html+='<div class="row" style="margin-top:10px"><button class="btn" id="injLog">'+esc(editing?I18N.t("inj.update"):I18N.t("inj.logBtn"))+'</button>';
    if(editing) html+='<button class="btn ghost" id="injCancel">'+esc(I18N.t("inj.cancel"))+'</button>';
    if(pepCur) html+='<button class="btn ghost" id="pepEdit">'+esc(I18N.t("inj.pepEdit"))+'</button>';
    html+='</div>';
    // twin-tab link: from injections, jump to the daily symptom diary
    html+='<div class="rellinks" style="margin-top:12px"><a class="btn ghost" href="#diary">'+icon("diary")+esc(I18N.t("rel.toDiary"))+icon("arrow")+'</a></div>';
    html+='</div>';
    }   // end dose form

    if(showForm){
    // ---- pen tracker: what to draw now (clicks / insulin syringe) ----
    if(injSeg==="mounjaro") html+=penTrackerHTML(st);

    // ---- history for this substance (editable) ----
    // Mounjaro: union of injLog entries and legacy jab.history dates (which predate injLog).
    var hlist=DOMAIN.visibleInjLog(st).filter(function(e){return e.substance===sub;}).slice();
    if(sub==="mounjaro"){
      var haveDate={}; hlist.forEach(function(e){ haveDate[e.date]=true; });
      (st.jab.history||[]).forEach(function(d){
        if(!haveDate[d]) hlist.push({ id:"jab:"+d, date:d, substance:"mounjaro", dose:null, unit:"mg", site:null, jabOnly:true });
      });
    }
    hlist.sort(function(a,b){var ka=a.ts||a.date,kb=b.ts||b.date;return ka<kb?1:ka>kb?-1:0;});
    if(hlist.length){
      // One block per entry, not a four-column table: on a phone those columns
      // left the site a strip one word wide, so "Brzuch — góra lewa 1.4 cm w
      // lewo · 7.8 cm w górę od pępka" broke across eight lines. Read top to
      // bottom instead: when it was, what went in, where, and what was drawn.
      html+='<div class="card"><h2>'+esc(I18N.t("inj.history"))+'</h2><div class="ihist">';
      injPage=pageClamp(injPage, hlist.length);
      pageSlice(hlist, injPage).forEach(function(e){
        var siteLbl=e.site?I18N.t("site."+e.site):"—"; if(siteLbl==="site."+e.site) siteLbl=e.site;
        var whenLbl=e.ts?fmtDateTime(e.ts):fmtDate(e.date);
        var where=e.pos ? siteLbl+" · "+posLabelShort(e.pos) : siteLbl;
        var meta=[];
        if(e.name) meta.push(e.name);
        if(e.penDraw) meta.push(penDrawLabel(e.penDraw));
        if(e.units!=null) meta.push(fmtUnits(e.units)+" "+I18N.t("sch.units")
          +(e.mgPerMl?" · "+fmtConc(e.mgPerMl)+" "+DOMAIN.vialUnitFor((peptideById(st,e.substance)||{}).unit)+"/ml":""));
        html+='<div class="ihrow">'
          +'<div class="ihtop"><span class="ihwhen">'+esc(whenLbl)+' '+dowBadge(e.date)
            +(e.sandbag?' <span class="pill minipill sb" title="'+esc(I18N.t("inj.sandbag"))+'">'+esc(I18N.t("inj.sandbagBadge"))+'</span>':'')
          +'</span>'
          +'<span class="ihact">'
            +'<button class="btn ghost sm injEdit" title="'+esc(I18N.t("inj.edit"))+'" data-id="'+esc(e.id)+'">'+icon("edit")+'</button>'
            +'<button class="btn ghost sm injDel" title="'+esc(I18N.t("inj.confirmDel"))+'" data-id="'+esc(e.id)+'">'+icon("trash")+'</button>'
          +'</span></div>'
          +(e.dose!=null?'<div class="ihpill">'
            +dosePill("", doseTxt(e.dose, e.unit||"", e.every, e.days, e.times, e.perDay), substColor(st, e.substance),
                      DOMAIN.therapyWeek(DOMAIN.firstInjDateFor(st,e.substance), e.date), doseWeekAsOf(st,e.substance,e.date))
            +'</div>':'')
          +'<div class="ihmeta">'+esc(where)+'</div>'
          +(meta.length?'<div class="ihmeta">'+esc(meta.join(" · "))+'</div>':'')
          +'</div>';
      });
      html+='</div>'+pagerHTML("injPg", injPage, hlist.length)+'</div>';
    }

    }   // end showForm
    app.innerHTML=html;

    function captureDraft(){
      if($("#injDose")) injDraft.dose=$("#injDose").value;
      if($("#injName")) injDraft.name=$("#injName").value;
      if($("#injDate")) injDraft.when=$("#injDate").value ? $("#injDate").value+"T"+($("#injTime").value||"12:00") : "";
      if($("#injSandbag")) injDraft.sandbag=$("#injSandbag").checked;
    }
    bindPager("injPg", function(){return injPage;}, function(v){injPage=v;}, viewInject);
    // free-point spot pick: any tap on the abdomen map (preserves typed inputs)
    var bm=$("#bellyMap");
    if(bm) bm.addEventListener("click",function(ev){
      var pt=bm.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
      var ctm=bm.getScreenCTM(); if(!ctm) return;
      var loc=pt.matrixTransform(ctm.inverse());
      var pos=svgToCm(loc.x, loc.y);
      // clamp to the mapped skin area and keep 0.1 cm precision
      pos.x=Math.round(Math.max(-19.5,Math.min(19.5,pos.x))*10)/10;
      pos.y=Math.round(Math.max(-14,Math.min(11.5,pos.y))*10)/10;
      captureDraft();
      injSel=pos;
      var chk=DOMAIN.spotCheck(pos, recentSpots(st));
      if(chk.nearNavel) toast(I18N.t("inj.tooCloseNavel"));
      else if(chk.nearShot) toast(I18N.t("inj.tooClose"));
      viewInject();
    });
    // pen tracker bindings (Mounjaro only)
    if(injSeg==="mounjaro"){
      var pt=st.penTracker;
      if(!pt.strengthChanges) pt.strengthChanges=[];
      if(!pt.doseChanges) pt.doseChanges=[];
      var ptRerender=function(){ captureDraft(); viewInject(); };
      // current shot (for pen numbering when recording mid-plan changes)
      var ptDone=pt.enabled?trkShotsDone(st):0;
      var ptCur=null;
      (function(){
        var ps=trkSchedule(pt, ptDone+8);
        if(!ps.error){ var c=trkShotAt(ps, ptDone); if(c.sh) ptCur=c; }
      })();
      if($("#ptOn")) $("#ptOn").addEventListener("change",function(){
        pt.enabled=this.checked;
        if(pt.enabled){   // seed from the calculator on first enable
          if(pt.strengthMg==null) pt.strengthMg=st.calc.strengthMg||5;
          if(pt.dose==null) pt.dose=(st.calc.baseDose!=null?st.calc.baseDose:pt.strengthMg);
        }
        STORE.save(); ptRerender();
      });
      bindChips("ptStr",function(v){
        if(ptDone===0 && !trkHasChanges(pt)){
          pt.strengthMg=v;                    // plan untouched — move the anchor
        } else if(ptCur){
          // mid-plan: record "the NEXT pen has strength v" without rewriting
          // history; picking the current strength back cancels a pending change
          var curPen=ptCur.sh.penNo+ptCur.off;
          pt.strengthChanges=pt.strengthChanges.filter(function(e){ return e.afterPen<curPen; });
          if(v!==trkStrengthOf(pt, curPen+1)) pt.strengthChanges.push({afterPen:curPen, s:v});
        } else {
          pt.strengthMg=v;                    // no valid schedule yet (dose empty)
        }
        STORE.save(); ptRerender();
      });
      if($("#ptDose")) $("#ptDose").addEventListener("change",function(){
        var v=this.value===""?null:parseFloat(this.value);
        if(ptDone===0 && !trkHasChanges(pt)){
          pt.dose=v;
        } else if(v>0){
          // mid-plan: the new dose applies from the upcoming shot onward
          pt.doseChanges=pt.doseChanges.filter(function(e){ return e.fromShot<ptDone; });
          if(v!==trkDoseAt(pt, ptDone)) pt.doseChanges.push({fromShot:ptDone, dose:v});
        }
        STORE.save(); ptRerender();
      });
      if($("#ptPre")) $("#ptPre").addEventListener("change",function(){
        pt.preDone=Math.max(0, parseInt(this.value,10)||0);
        STORE.save(); ptRerender();
      });
      if($("#ptReset")) $("#ptReset").addEventListener("click",function(){
        if(!confirm(I18N.t("trk.resetConfirm"))) return;
        // fresh full pen at the latest strength and dose; counting restarts
        // from today (tomorrow when today's dose is already logged — it
        // belonged to the finished plan)
        pt.strengthMg=trkStrengthOf(pt, Infinity);
        var dInf=trkDoseAt(pt, Infinity); if(dInf!=null) pt.dose=dInf;
        pt.strengthChanges=[]; pt.doseChanges=[];
        pt.preDone=0; pt.shotsDone=0;
        var tdy=todayISO();
        pt.anchor=(st.jab.history||[]).indexOf(tdy)>=0 ? nextDayISO(tdy) : tdy;
        STORE.save(); ptRerender();
      });
    }
    // config inputs
    if($("#mjEvery")) $("#mjEvery").addEventListener("change",function(){ setSubstInterval(st,"mounjaro",parseEvery(this.value,7)); STORE.save(); viewInject(); });
    if($("#trtEvery")) $("#trtEvery").addEventListener("change",function(){ setSubstInterval(st,"trt",parseEvery(this.value,3)); STORE.save(); viewInject(); });
    if($("#trtPerDay")) $("#trtPerDay").addEventListener("change",function(){
      setSubstSchedule(st, "trt", parseEvery(st.inj.trt.intervalDays,3), substDays(st,"trt"),
                       substTimes(st,"trt"), DOMAIN.normPerDay(this.value));
      STORE.save(); viewInject();
    });
    if($("#trtMode")) $("#trtMode").addEventListener("change",function(){
      // Switching to weekdays with nothing picked yet seeds today, so the card
      // never sits in a state with a plan that counts down to nothing.
      var toDays=this.value==="days";
      setSubstSchedule(st, "trt", parseEvery(st.inj.trt.intervalDays,3),
                       toDays?(substDays(st,"trt")||[DOMAIN.dowIndex(todayISO())]):null);
      STORE.save(); viewInject();
    });
    bindDowPick("trtDays", function(sel){
      setSubstSchedule(st, "trt", parseEvery(st.inj.trt.intervalDays,3), sel, readTimePick("trtTimes"));
      STORE.save(); viewInject();
    });
    bindTimePick("trtTimes", function(sel){
      setSubstSchedule(st, "trt", parseEvery(st.inj.trt.intervalDays,3), substDays(st,"trt"), sel);
      STORE.save(); viewInject();
    });
    if($("#trtAllDays")) $("#trtAllDays").addEventListener("click",function(){
      setSubstSchedule(st, "trt", parseEvery(st.inj.trt.intervalDays,3), [1,2,3,4,5,6,7], readTimePick("trtTimes"));
      STORE.save(); viewInject();
    });
    // stamp the chosen interval onto every entry of the open substance in the
    // date range (sandbag-hidden ones included — the schedule was a fact either
    // way). Never touches another substance's shots.
    if($("#bfApply")) $("#bfApply").addEventListener("click",function(){
      var from=$("#bfFrom").value||null, to=$("#bfTo").value||null;
      var bev=parseEvery($("#bfEvery").value,1);
      var hits=(st.injLog||[]).filter(function(e){
        return e && e.substance===sub && e.date && (!from||e.date>=from) && (!to||e.date<=to);
      });
      if(!hits.length){ toast(I18N.t("inj.backfillNone")); return; }
      if(!confirm(I18N.t("inj.backfillConfirm")+" "+hits.length)) return;
      // Saying "this range ran every N days" also says it was not on a weekday
      // plan, so a leftover day set from a later rhythm must not outrank it.
      hits.forEach(function(e){ e.every=bev; delete e.days; });
      STORE.save(); toast(I18N.t("inj.backfillDone")+" "+hits.length); viewInject();
    });
    if($("#injDose") && $("#pepDraw")){
      $("#injDose").addEventListener("input",function(){
        var pd=peptideById(st, sub);
        if(pd) $("#pepDraw").innerHTML=drawBoxHTML(st, pd, parseFloat(this.value), ($("#injDate")&&$("#injDate").value)||null);
      });
    }
    bindPeptides(st);
    // log / update
    if($("#injLog")) $("#injLog").addEventListener("click",function(){
      // spot: a user-picked point wins; otherwise an edited entry keeps its
      // stored spot untouched; a brand-new entry takes the suggested clear spot
      var pos=null, site=null;
      if(injSel){ pos=injSel; site=bellyQuadrant(injSel); }
      else if(editing){ pos=editing.pos||null; site=editing.site||null; }
      else { pos=DOMAIN.suggestSpot(recentSpots(st)); site=pos?bellyQuadrant(pos):null; }
      var dv=$("#injDose").value, dose=dv===""?null:parseFloat(dv);
      dose=(dose==null||isNaN(dose))?null:dose;
      var name=$("#injName")?($("#injName").value||"").trim():null;
      // when given: chosen datetime (defaults to now); ts is full datetime, date is the day part
      var wv=$("#injDate")&&$("#injDate").value ? $("#injDate").value+"T"+($("#injTime").value||"12:00") : "";
      var when=wv?new Date(wv):new Date(); if(isNaN(when.getTime())) when=new Date();
      var ts=when.toISOString(), dateStr=ts.slice(0,10);
      // sandbag flag: only when the checkbox is rendered (TRT + setting on);
      // null leaves an edited entry's stored flag untouched
      var sb=$("#injSandbag")?$("#injSandbag").checked:null;
      var mjDate;
      if(editing && editing.jabOnly){
        // materialise the legacy date into a real injLog entry (keep its original day)
        var mat={ id:uid(), ts:editing.date+"T"+ts.slice(11), date:editing.date, substance:"mounjaro", dose:dose, unit:"mg", site:site };
        if(pos) mat.pos=pos;
        st.injLog.push(mat);
        mjDate=editing.date;
      } else if(editing){
        editing.dose=dose; editing.ts=ts; editing.date=dateStr;
        if(injSel){ editing.site=site; editing.pos=pos; }  // spot only changes when re-picked
        if(sb!==null){ if(sb) editing.sandbag=true; else delete editing.sandbag; }
        // interval backfill: re-saving a pre-stamping TRT entry adopts the
        // current interval; an already-stamped entry keeps its historical one
        if(injSeg==="trt" && editing.every==null && !DOMAIN.normDays(editing.days))
          editing.every=parseEvery(st.inj.trt.intervalDays,3);
        // the dose or the day may have moved, so the drawn units are re-read
        // from the vial that was open on the (possibly new) date
        stampDraw(st, editing);
        if(editing.substance==="mounjaro") mjDate=dateStr;
      } else {
        var pepE=peptideById(st, sub);
        var unitCode=pepE?(pepE.unit||"j"):"mg";
        var entry={ id:uid(), ts:ts, date:dateStr, substance:sub, dose:dose, unit:unitCode, site:site };
        if(pos) entry.pos=pos;
        // TRT dosage = mg per shot + interval; snapshot the interval so a
        // schedule change (e.g. every 2 days -> daily) reads as a dose change
        if(injSeg==="trt") entry.every=parseEvery(st.inj.trt.intervalDays,3);
        if(sb) entry.sandbag=true;
        if(pepE){
          entry.every=pepInterval(st, pepE);   // Tirzepatyd routes this through st.calc
          stampDraw(st, entry);
        }
        // Last word on the cadence, after every branch that sets a number: on a
        // weekday plan the days ARE the cadence, and a single gap would be a
        // fiction (Tue->Thu is two days, Thu->Tue is five).
        var subDays=substDays(st, sub), subTimes=substTimes(st, sub);
        if(subDays){ entry.days=subDays.slice(); delete entry.every; }
        // The hours ride either rhythm, so they are stamped either way.
        if(subTimes) entry.times=subTimes.slice();
        var subPd=substPerDay(st, sub);
        if(subPd>1) entry.perDay=subPd;
        // The tracker position derives from jab.history, so logging (and
        // deleting) needs no counter bookkeeping. The FIRST Mounjaro entry of
        // a day — one new dose — is stamped with the planned breakdown so
        // history shows what came from where; a second entry the same day is
        // the extra needle of the same mixed dose.
        if(sub==="mounjaro" && st.penTracker.enabled
           && st.jab.history.indexOf(dateStr)===-1
           && !st.injLog.some(function(e){return e.substance==="mounjaro"&&e.date===dateStr;})
           && (!st.penTracker.anchor || dateStr>=st.penTracker.anchor)){
          var pd=trkCurrentDraw(st);
          if(pd) entry.penDraw=pd;
        }
        st.injLog.push(entry);
        if(sub==="mounjaro") mjDate=dateStr;
      }
      // Mounjaro: keep the weekly ring's source of truth (jab.history) in sync with the chosen day
      if(mjDate && st.jab.history.indexOf(mjDate)===-1){ st.jab.history.push(mjDate); st.jab.history.sort(); }
      st.injLog.sort(function(a,b){var ka=a.ts||a.date,kb=b.ts||b.date;return ka<kb?1:ka>kb?-1:0;});
      injSel=null; injEdit=null; injPage=0; injDraft={dose:"",name:"",when:"",sandbag:null};
      STORE.save(); toast(I18N.t("common.saved")); viewInject();
    });
    if($("#injCancel")) $("#injCancel").addEventListener("click",function(){ injEdit=null; injSel=null; injDraft={dose:"",name:"",when:"",sandbag:null}; viewInject(); });
    $all(".injEdit").forEach(function(b){ b.addEventListener("click",function(){
      injEdit=b.getAttribute("data-id"); injSel=null; viewInject(); window.scrollTo(0,0);
    });});
    $all(".injDel").forEach(function(b){ b.addEventListener("click",function(){
      if(!confirm(I18N.t("inj.confirmDel"))) return;
      var id=b.getAttribute("data-id");
      if(id.indexOf("jab:")===0){           // legacy Mounjaro date only
        var d=id.slice(4);
        st.jab.history=st.jab.history.filter(function(x){return x!==d;});
      } else {
        var del=null;
        st.injLog=st.injLog.filter(function(e){ if(e.id===id){ del=e; return false; } return true; });
        // Mounjaro: also drop the date from jab.history if no other entry
        // covers it — the pen tracker derives its position from jab.history,
        // so this is all the bookkeeping a delete needs
        if(del && del.substance==="mounjaro" && !st.injLog.some(function(e){return e.substance==="mounjaro"&&e.date===del.date;}))
          st.jab.history=st.jab.history.filter(function(x){return x!==del.date;});
      }
      if(injEdit===id) injEdit=null;
      STORE.save(); viewInject();
    });});
  }

  /* ============ DASHBOARD (Pulpit) ============ */
  // Two stacked columns: what it is on the left, when it is due on the right.
  // The exact moment sits under the countdown, so a half-day cadence tells you
  // straight away whether the next shot is a morning or an evening one.
  // One substance, one line: a coloured dot, its name, and when the next shot is
  // due. The dashboard answers only that — dose, rhythm and the period counters
  // live one tap away in Injections, where they are also edited. The wave stays
  // as a hairline under the row: still a glance at how much of the wait has run
  // down, without a third level of text. progressBar is deliberately not reused
  // here — it appends a label row that would be two empty spans on every row.
  function rhythmRow(label, color, frac, right, foot, href, overdue, due){
    var tag=href?'a class="rrow'+(due?" due":"")+(overdue?" late":"")+'" href="'+esc(href)+'"'
                :'div class="'+(due?"due":"")+(overdue?" late":"")+'"';
    var pct=Math.max(0,Math.min(1,frac||0))*100;
    // Past due, `overdue` now decides only two things: the red countdown figure
    // (via the `late` class) and a full bar. Everything that carries colour —
    // tint, edge, badge, bar — stays the substance's own, so a row asking to be
    // dealt with is still recognisably itself.
    return '<'+tag+' style="margin-bottom:9px;--c:'+color+';--ct:'+color+PAL.tintA+'">'
      +'<div class="rrhead">'
        +'<span class="rrname"><span class="rrdot" style="background:'+color+'"></span>'
          +'<span class="rrlbl">'+esc(label)+'</span>'
          +(due?'<span class="duebadge">'+esc(I18N.t("inj.dueBadge"))+'</span>':'')+'</span>'
        +'<span class="rrwhen">'
          +'<span class="rrin'+(overdue?" late":"")+'">'+esc(right||"")+'</span>'
          +(foot?'<span class="rrat">'+esc(foot)+'</span>':'')
        +'</span>'
      +'</div>'
      +'<div class="wbar slim"><span class="'+(overdue?"late":"")+'" style="width:'+pct.toFixed(1)
        +'%;background:'+color+'"></span></div>'
      + (href?'</a>':'</div>');
  }
  // Every view opens with this: the title plus the two history arrows. In an
  // installed PWA there is no browser chrome to go back with, so without them the
  // only way out of a view is the tab bar.
  function navBtnHTML(id, ic, key, on){
    return '<button type="button" class="navbtn" id="'+id+'" title="'+esc(I18N.t(key))+'" aria-label="'+esc(I18N.t(key))+'"'
      +(on?'':' disabled')+'>'+icon(ic)+'</button>';
  }
  // The enabled state is baked into the markup rather than applied afterwards:
  // views re-render themselves straight into #app dozens of times, and anything a
  // post-render pass had set would silently vanish on the next self-render.
  function pageHead(titleKey){
    return '<div class="pagehead">'
      +navBtnHTML("navBack","back","nav.back",canBack())
      +navBtnHTML("navFwd","fwd","nav.fwd",canFwd())
      +'<h1 class="page">'+esc(I18N.t(titleKey))+'</h1></div>';
  }
  function viewDash(){
    var st=s(), today=todayISO();
    var html=pageHead("pulpit.title");

    // --- illness banner: only while an episode is running, so a healthy day
    // adds no clutter. The end button lives in the journal, hence the link. ---
    var illNow=DOMAIN.illnessAsOf(st, today);
    if(illNow && illNow.ongoing){
      var ic=illColor(illNow.severity);
      html+='<a class="banner" href="#diary" style="background:'+ic+'1a;border-color:'+ic+'59;color:'+ic
        +';text-decoration:none;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">'
        +'<span>&#129298; <b>'+esc(I18N.t("ill.ongoing"))+'</b> &middot; '+esc(I18N.t("ill.dayN"))+' '+illNow.dayN
        +(illNow.label?' &middot; '+esc(illNow.label):'')+'</span>'
        +'<span class="btn ghost sm">'+esc(I18N.t("ill.end"))+'</span></a>';
    }

    // --- rhythm widgets ---
    html+='<div class="card"><h2>'+esc(I18N.t("pulpit.rhythm"))+'</h2>';
    // Every substance, never a truncated list: substRows already settles which
    // ones exist (the Mounjaro/Tirzepatyd dedupe, the tab switch, archived ones
    // left out), so the dashboard and Injections can never disagree about that.
    // Soonest first, which puts anything overdue at the top; a substance with no
    // shots yet has nothing to count down and sits at the bottom rather than
    // vanishing, which is how one could go missing entirely before.
    // substRows is the ONE source of order, exactly as in Injections, so the list
    // a row was dragged into is the list seen here. Deliberately not re-sorted by
    // time: an overdue substance may therefore sit at the bottom, and the "due
    // now" highlight is what surfaces it — the two decisions go together, so
    // putting a sort back here would quietly undo the order the user set.
    substRows(st).forEach(function(id){
      var lastTs=lastInjTs(st,id);
      var cd=DOMAIN.doseCountdown(lastTs, substInterval(st,id), Date.now(),
                                  substDays(st,id), substTimes(st,id), substDayCtx(st, id, lastTs));
      var c=substColor(st, id), href=DOMAIN.buildRoute("inject", id);
      // Just the figure, not "next in ..." / "... overdue": the exact moment sits
      // right beside it and the red minus already says which side of due it is.
      // The words were costing more width than the substance name had.
      if(cd) html+=rhythmRow(substLabel(st,id), c, cd.overdue?1:cd.frac,
                             (cd.overdue?"\u2212":"")+fmtCountdown(cd),
                             fmtNextShot(cd.nextMs), href, cd.overdue, DOMAIN.dueNow(cd));
      else html+=rhythmRow(substLabel(st,id), c, 0, I18N.t("inj.pepNoShots"), null, href, false, false);
    });
    html+='</div>';

    // --- latest readings: BP, weight + delta, BMI --- (each dated: values come from different days)
    // ts (when the reading has one) dims the syringe for readings taken before that day's shot
    function statDate(iso, ts){ return iso?'<span class="muted tiny" style="font-weight:600">'+esc(fmtDate(iso,true))+injDayMarkers(st,iso,ts)+'</span>':''; }
    html+='<div class="card"><h2>'+esc(I18N.t("pulpit.latest"))+'</h2><div class="stats">';
    var bpL=(st.bp&&st.bp.log&&st.bp.log.length)?st.bp.log[0]:null;
    html+='<a class="stat" href="#bp"><span class="k">'+esc(I18N.t("pulpit.bp"))+'</span><span class="v">'+(bpL?esc(bpL.sys+"/"+bpL.dia+(bpL.pulse!=null?" · "+bpL.pulse:"")):I18N.t("pulpit.noData"))+'</span>'+(bpL?statDate(String(bpL.ts).slice(0,10), bpL.ts):'')+'</a>';
    var wl=st.weightLog||[], curW=wl.length?wl[0].weightKg:null;
    var wtxt=curW!=null?fmtNum(curW,1)+" kg":I18N.t("pulpit.noData");
    // month-to-date + total deltas on their own line, each coloured by its own sign
    function dSpan(lbl,v){ return '<span style="color:'+(v<=0?"var(--good)":"var(--bad)")+'">'+esc(lbl)+' '+(v>0?"+":"")+fmtNum(v,1)+'</span>'; }
    var wDeltas='';
    if(wl.length>1){
      var first=wl[wl.length-1].weightKg, d=curW-first;
      var wmc=DOMAIN.monthChange(wl, "weightKg", today);
      wDeltas='<span class="muted tiny" style="font-weight:600;white-space:nowrap">'+(wmc?dSpan(I18N.t("pulpit.monthShort"),wmc.diff)+' · ':'')+dSpan(I18N.t("pulpit.totalShort"),d)+'</span>';
    }
    html+='<a class="stat" href="#weight"><span class="k">'+esc(I18N.t("pulpit.weight"))+'</span><span class="v" style="font-size:18px">'+wtxt+'</span>'+wDeltas+(wl.length?statDate(wl[0].date, wl[0].ts):'')+'</a>';
    var waistL=wl.filter(function(e){return e.waistCm!=null;});
    if(waistL.length){
      var curWa=waistL[0].waistCm, watxt=fmtNum(curWa,1)+" cm", wacol="var(--ink)";
      if(waistL.length>1){ var dWa=curWa-waistL[waistL.length-1].waistCm; wacol=dWa<=0?"var(--good)":"var(--bad)"; watxt+=" ("+(dWa>0?"+":"")+fmtNum(dWa,1)+")"; }
      html+='<a class="stat" href="#weight"><span class="k">'+esc(I18N.t("weight.waist"))+'</span><span class="v" style="color:'+wacol+';font-size:18px">'+watxt+'</span>'+statDate(waistL[0].date, waistL[0].ts)+'</a>';
    }
    // latest wellbeing values from today (notes with dots or legacy check-ins)
    var ckAll=(st.stateLog||[]).slice();
    (st.journal||[]).forEach(function(e){ if(hasStateVals(e)) ckAll.push(e); });
    ckAll.sort(function(a,b){ return a.ts<b.ts?1:a.ts>b.ts?-1:0; });
    var todayCk=ckAll.filter(function(e){ return String(e.ts).slice(0,10)===today; })[0];
    html+='<a class="stat" href="#diary"><span class="k">'+esc(I18N.t("state.title"))+'</span><span class="v" style="font-size:15px">'
      +(todayCk?statePillsHTML(todayCk):esc(I18N.t("pulpit.noData")))+'</span>'
      +(todayCk?statDate(String(todayCk.ts).slice(0,10), todayCk.ts):'')+'</a>';
    var bmiV=DOMAIN.bmi(curW, st.profile.heightCm);
    if(bmiV){ var cat=DOMAIN.bmiCategory(bmiV);
      html+='<a class="stat" href="#weight"><span class="k">'+esc(I18N.t("pulpit.bmi"))+'</span><span class="v" style="color:'+PAL.bmi[cat.band]+'">'+fmtNum(bmiV,1)+'</span>'+(wl.length?statDate(wl[0].date, wl[0].ts):'')+'</a>'; }
    else { html+='<a class="stat" href="#weight"><span class="k">'+esc(I18N.t("pulpit.bmi"))+'</span><span class="v muted" style="font-size:13px">'+esc(I18N.t("pulpit.bmiNeed"))+'</span></a>'; }
    html+='</div></div>';

    // --- mini body map (link to injections) ---
    if(DOMAIN.visibleInjLog(st).length){
      // the whole card is the link, map included — the hint alone was a small
      // target next to a big obvious one. The map keeps pointer-events off so a
      // tap on it falls through to the anchor instead of hitting the SVG.
      html+='<a class="card" href="#inject" style="display:block;text-decoration:none;color:inherit">'
        +'<span style="color:var(--brand);font-weight:700;font-size:13px">'+esc(I18N.t("pulpit.mapHint"))+'</span>'
        +'<div style="pointer-events:none">'+bellyMapSVG(st, null)+'</div></a>';
    }

    app.innerHTML=html;
  }

  /* ============ CORRELATIONS ============ */
  function seriesOptions(st){
    var opts=[];
    (st.metrics||[]).filter(function(m){return !m.archived;}).forEach(function(m){
      opts.push({ id:"metric:"+m.id, label:m.name });
    });
    ["mounjaro","trt"].concat(peptideList(st,true).map(function(p){ return p.id; })).forEach(function(k){
      if(DOMAIN.visibleInjLog(st).some(function(e){return e.substance===k && e.dose!=null;}))
        opts.push({ id:"inj:"+k, label:substLabel(st,k)+" "+I18N.t("corr.injDose") });
    });
    if((st.bp&&st.bp.log&&st.bp.log.length)){
      opts.push({ id:"vital:sys", label:I18N.t("corr.vital.sys") });
      opts.push({ id:"vital:dia", label:I18N.t("corr.vital.dia") });
      if(st.bp.log.some(function(e){return e.pulse!=null;})) opts.push({ id:"vital:pulse", label:I18N.t("corr.vital.pulse") });
    }
    if((st.weightLog||[]).length){
      opts.push({ id:"weight", label:I18N.t("corr.weight") });

  function runTravel(){
    var st=s(), tv=st.settings.travel;
    var S=st.calc.strengthMg||5, D=(tv.dose!=null?tv.dose:S);
    var homeCur=st.settings.currency;
    var rxStr=rxPenFor(D);
    var destSame=(tv.penCosts?tv.penCosts[String(S)]:null);
    var destRx = rxStr==null ? null : (rxStr===S ? destSame : (tv.penCosts?tv.penCosts[String(rxStr)]:null));
    var homePrice = st.settings.penCosts ? st.settings.penCosts[String(S)] : null;
    // A "month" here means 4 weeks (28 days) — the natural unit for a weekly pen,
    // where one standard pen = 4 doses = 4 weeks ≈ one monthly supply.
    var tripDays = (tv.tripValue>0) ? (tv.tripUnit==="months" ? tv.tripValue*28 : tv.tripValue*7) : 0;
    var r=DOMAIN.travelCompare({ homeStrength:S, dose:D, intervalDays:st.calc.intervalDays||7,
      golden:st.settings.goldenDose, rate:tv.rate, homePrice:homePrice, monthDays:28,
      destPriceSame:destSame, destPriceRx:destRx, rxStrength:rxStr, tripDays:tripDays });
    if(!r.home || (!r.same && !r.rx)){
      $("#optResult").innerHTML='<div class="card"><div class="empty">'+esc(I18N.t("trv.needInputs"))+'</div></div>'; return;
    }
    var destCur=tv.currency||"";
    function money(n){ return fmtMoney(n,homeCur); }
    function moneyTxt(n){ return fmtMoneyTxt(n,homeCur); }
    function destOrig(n){ return fmtNum(n,0); }
    function tx(key,map){ var t=I18N.t(key); for(var k in map){ t=t.split("{"+k+"}").join(map[k]); } return t; }
    // a row of period figures. When dosing is weekly, one shot == one week, so we
    // show just per week + per month (no redundant per-shot). Otherwise all three.
    var weekly=((st.calc.intervalDays||7)===7);
    function periods(perShot, perWeek, perMonth, col){
      var c=col?' style="color:'+col+'"':'';
      function cell(amt, unitKey){ return '<div class="per"><b'+c+'>'+money(amt)+'</b><span>'+esc(I18N.t(unitKey))+'</span></div>'; }
      if(weekly) return '<div class="pers two">'+cell(perWeek,"trv.perWeek")+cell(perMonth,"trv.perMonth2")+'</div>';
      return '<div class="pers">'+cell(perShot,"trv.perShot2")+cell(perWeek,"trv.perWeek")+cell(perMonth,"trv.perMonth2")+'</div>';
    }
    // one full-width breakdown card: title, plain explanation, big pen price,
    // the three period costs and how long one pen lasts.
    function scCard(title, ex, sc){
      if(!sc) return "";
      return '<div class="tcard"><h3>'+esc(title)+'</h3><p class="ex">'+esc(ex)+'</p>'
        +'<div class="big">'+money(sc.priceHome)+' <small>'+esc(I18N.t("trv.perPen"))+'</small></div>'
        + periods(sc.perShot, sc.perWeek, sc.perMonth)

    }
    // trip planner card (only when a trip length is given)
    function tripCard(){
      var t=r.trip; if(!t || !t.home) return "";
      var tripTxt=(tv.tripUnit==="months"?tv.tripValue+" "+I18N.t("trv.months"):tv.tripValue+" "+I18N.t("trv.weeks"));
      var h='<div class="tcard" style="border-color:var(--brand)"><h3>'+esc(I18N.t("trv.tripTitle"))+'</h3>'
        +'<div class="big">'+esc(tx("trv.tripBring",{k:t.home.pens}))+'</div>'
        +'<div class="meta">'+esc(tx("trv.tripShotsOver",{n:t.shots,t:tripTxt}))+' · '+esc(tx("trv.tripHomeCost",{c:moneyTxt(t.home.cost)}))+'</div>';
      function leg(label, lg, save){
        if(!lg) return "";
        var verdict = save==null?"" : (save>0?tx("trv.tripSave",{c:moneyTxt(Math.abs(save))}):tx("trv.tripMore",{c:moneyTxt(Math.abs(save))}));
        var col=save==null?"var(--muted)":(save>0?"var(--good)":"var(--bad)");
        return '<div class="meta" style="margin-top:8px">'+esc(label)+(verdict?' — <b style="color:'+col+'">'+esc(verdict)+'</b>':'')+'</div>';
      }
      h+=leg(tx("trv.tripSame",{k:t.same?t.same.pens:0,c:t.same?moneyTxt(t.same.cost):"—"}), t.same, t.saveSame);
      if(rxStr!==S) h+=leg(tx("trv.tripRx",{k:t.rx?t.rx.pens:0,c:t.rx?moneyTxt(t.rx.cost):"—"}), t.rx, t.saveRx);
      return h+'</div>';
    }
    var rateNote="";
    if(tv.rate!=null && tv.rate>0 && destCur){
      rateNote='<p class="tiny muted" style="margin:-4px 0 12px">'+esc(tx("trv.rateUsed",{home:homeCur,rate:fmtNum(tv.rate,4),dest:destCur}))+'</p>';
    }
    var pensNeeded = (r.rx&&r.home)?Math.max(1,Math.ceil(r.home.shotsPerPen/r.rx.shotsPerPen)):0;
    var exHome=tx("trv.exHome",{s:S,d:D,n:r.home.shotsPerPen,m:fmtNum(r.home.coverMonths,1)});
    var exSame=r.same?tx("trv.exSame",{s:S,orig:destOrig(destSame),cur:destCur,pln:moneyTxt(r.same.priceHome),n:r.same.shotsPerPen}):"";
    var exRx=r.rx?tx("trv.exRx",{s:rxStr,orig:destOrig(destRx),cur:destCur,pln:moneyTxt(r.rx.priceHome),n:r.rx.shotsPerPen,k:pensNeeded}):"";
    var trip=tripCard();
    var html='<div class="card"><h2>'+esc(I18N.t("opt.modeTravel"))+'</h2>'+rateNote
      + (trip?'<div class="tgrid" style="margin-bottom:14px">'+trip+'</div>':'')
      +'<div class="tsub">'+esc(tx("trv.whatPay",{home:homeCur}))+'</div>'
      +'<div class="tgrid">'
      + scCard(tx("trv.rowHome",{s:S}), exHome, r.home)
      + scCard(tx("trv.rowSame",{s:S}), exSame, r.same)
      + (r.rx && rxStr!==S ? scCard(tx("trv.rowRx",{s:rxStr}), exRx, r.rx) : "")
      +'</div>';
    if(rxStr==null) html+='<div class="warnbox" style="margin-top:8px">'+esc(I18N.t("trv.rxNA"))+'</div>';
    html+='</div>';
    $("#optResult").innerHTML=html;
  }
  function runPlan(){

    r.shots.forEach(function(sh,i){
      html+='<tr><td>#'+(i+1)+' <span class="muted tiny">'+esc(sh.fraction===0.5?I18N.t("opt.half"):I18N.t("opt.full"))+'</span></td>'
          +'<td><span class="pill" style="background:'+doseColor(sh.dose)+PAL.tintA+';color:'+doseColor(sh.dose)+'">'+fmtNum(sh.actualMg,2)+' mg</span></td>'
          +'<td class="num">'+sh.clicks+'</td>'

      + stat(I18N.t("opt.shotsPerPen"), r.totalShots)
      + stat(I18N.t("opt.lasts"), r.totalDays+" "+I18N.t("opt.days")+" · "+fmtNum(r.weeks,1)+" "+I18N.t("common.weeks"))
      + stat(I18N.t("opt.avgWeeklyMg"), fmtNum(r.avgWeeklyMg,2)+" mg")
      + stat(I18N.t("opt.leftover"), r.leftover+" "+I18N.t("common.clicks"))
      + '</div>';
    html+='<div class="note" style="margin-top:12px">'+esc(I18N.t("opt.budget"))+': <b>'+r.budget+' '+I18N.t("common.clicks")+'</b> · '+fmtNum(r.months,1)+' '+I18N.t("opt.months")+'</div>';
    html+='<div class="note" style="margin-top:10px">'+esc(clickEqText(S))+'</div>';
    if(P!=null){
      html+='<div class="stats" style="margin-top:12px">'
        + stat(I18N.t("opt.costPerWeek"), fmtMoney(r.weeklyCost,cur))
        + stat(I18N.t("opt.monthlyCost"), fmtMoney(r.monthlyCost,cur))
        + stat(I18N.t("opt.extraDays"), (r.extraDays>=0?"+":"")+r.extraDays+" "+I18N.t("opt.days"), r.extraDays>0?"var(--good)":"")
        + stat(I18N.t("opt.savingsMoney"), fmtMoney(r.savingPerWeek,cur), r.savingPerWeek>0?"var(--good)":"")
        + '</div>';
    } else {
      html+='<div class="note" style="margin-top:10px">'+esc(I18N.t("opt.enterPrice"))+'</div>';

    html+='</div>';

    if(st.settings.goldenDose.enabled){

  function runProg(){
    var st=s(), pg=st.calc.prog;
    var S=st.calc.strengthMg||5, from=pg.from, to=pg.to, cur=st.settings.currency;
    var P=(st.settings.penCosts?st.settings.penCosts[String(S)]:null);
    function warn(msg){ $("#optResult").innerHTML='<div class="card"><div class="warnbox">'+esc(msg)+'</div></div>'; }
    var levels=null, computedStep=null, wps=1;
    if(pg.method==="manual"){
      levels=(pg.manual||"").split(/[\s,;]+/).map(parseFloat).filter(function(x){return !isNaN(x)&&x>0;});
      if(!levels.length){ warn(I18N.t("prog.needManual")); return; }
    } else if(pg.method==="time"){
      if(!(to>from)){ warn(I18N.t("prog.needTarget")); return; }
      var rl=DOMAIN.rampLevelsByWeeks(from,to,pg.weeks); levels=rl.levels; computedStep=rl.step;
    } else {
      if(!(to>from)){ warn(I18N.t("prog.needTarget")); return; }
      wps=Math.max(1,pg.weeksPerStep||1);
      levels=DOMAIN.rampLevelsByStep(from,to,pg.step);
    }
    var r=DOMAIN.rampSchedule(levels, wps, S, st.settings.goldenDose, P);
    if(r.error){ warn(I18N.t("prog.needTarget")); return; }
    var infeasible=r.schedule.filter(function(d){return !d.feasible;});
    function stat(k,v,col){ return '<div class="stat"><span class="k">'+esc(k)+'</span><span class="v"'+(col?' style="color:'+col+'"':'')+'>'+v+'</span></div>'; }
    var html='<div class="card"><h2>'+esc(I18N.t("prog.planTitle"))+'</h2>'
      +'<div class="note" style="margin-bottom:12px">'+esc(I18N.t("prog.reachesIn").replace("{to}",fmtNum(r.target,2)).replace("{n}",r.weeksToTarget))
        +(computedStep!=null?' · '+esc(I18N.t("prog.computedStep").replace("{s}",fmtNum(computedStep,2))):'')+'</div>'
      +'<div class="stats" style="margin-bottom:12px">'
      + stat(I18N.t("prog.totalWeeks"), r.totalWeeks+" "+I18N.t("common.weeks"))
      + stat(I18N.t("prog.totalMg"), fmtNum(r.totalMg,1)+" mg")
      + (r.totalCost!=null?stat(I18N.t("opt.totalCost"), fmtMoney(r.totalCost,cur)):"")
      +'</div>';
    if(infeasible.length){
      html+='<div class="warnbox" style="margin-bottom:12px">'+esc(I18N.t("opt.planInfeasible"))+'</div>';
    }
    // week-by-week schedule (one row per week)
    html+='<div class="scroll"><table><thead><tr><th>'+esc(I18N.t("prog.week"))+'</th><th>'+esc(I18N.t("common.dose"))+'</th><th class="num">'+esc(I18N.t("common.clicks"))+'</th>'
      +(P!=null&&!isNaN(P)?'<th class="num">'+esc(I18N.t("opt.costPerWeek"))+'</th>':'')+'</tr></thead><tbody>';
    var wk=0;
    r.schedule.forEach(function(d){
      for(var i=0;i<d.weeks;i++){ wk++;
        html+='<tr><td>'+wk+'</td>'
          +'<td><span class="pill" style="background:'+doseColor(d.mg)+PAL.tintA+';color:'+doseColor(d.mg)+'">'+fmtNum(d.mg,2)+' mg</span></td>'
          +'<td class="num">'+d.clicks+(d.feasible?'':' ⚠')+'</td>'
          +(P!=null&&!isNaN(P)?'<td class="num">'+fmtMoney(d.costPerWeek,cur)+'</td>':'')+'</tr>';
      }
    });
    html+='</tbody></table></div></div>';
    $("#optResult").innerHTML=html;
  }

    + fxStatusHTML()
    +'</div>'
    + linkCardHTML()
    +'<div class="card"><h2>'+esc(I18N.t("set.data"))+'</h2>'
    +'<p class="sub">'+esc(I18N.t("set.exportHint"))+'</p>'
    +'<div class="row">'
      +'<button class="btn" id="setExport">⬇ '+esc(I18N.t("set.export"))+'</button>'
      +'<button class="btn ghost" id="setImportBtn">⬆ '+esc(I18N.t("set.import"))+'</button>'
