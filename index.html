          pu=parseInt(($("#bpPulse"+i)||{}).value,10);
      if(!isNaN(sy) || !isNaN(di) || !isNaN(pu))
        rows.push({ sys:isNaN(sy)?null:sy, dia:isNaN(di)?null:di, pulse:isNaN(pu)?null:pu });
    }
    return rows;
  }
  function viewBP(){
    var st=s();
    var series=!!st.settings.bpSeries;
    var log = st.bp.log || [];
    var editing=null;
    if(bpEdit){
      for(var bi=0;bi<log.length;bi++){ if(log[bi].id===bpEdit){ editing=log[bi]; break; } }
      if(!editing) bpEdit=null;
    }
    var morning = new Date().getHours() < 12;   // sensible default: morning = fasting
    // current Mounjaro/TRT dose pills (same context as the journal composer)
    function bpCtxHtml(dISO){ var tags=weekTags(st, dISO); return tags.length?weekPills(tags):''; }
    // doses in effect on a reading's date (shared pill renderer)
    function doseCell(e){ return dosePillsAsOf(st, String(e.ts).slice(0,10), e.doseMg); }
    var html=''
    + pageHead("bp.title");

    // chart card (on top); the range bar narrows to a day window and ‹ › page it
    var win=DOMAIN.chartWindow(log, "ts", bpRange.days, bpRange.offset, todayISO());
    bpRange.offset=win.offset;   // keep state in sync with the clamp
    var chartLog=win.entries;
    function noonMs(iso){ return new Date(iso+"T12:00:00").getTime(); }
    html+='<div class="card">'+rangeHeader("bp.chartTitle","bpRg",bpRange,win)
        + '<div id="bpChart">'+CHART.renderBP(chartLog, {illness:illSpansFor(chartLog,"ts",win),
            minX:win.from?noonMs(win.from)-43200000:null, maxX:win.to?noonMs(win.to)+43200000:null})+'</div>';
    if(log.length){
      var L=log[0];
      // colour key matching the chart lines: red=systolic, blue=diastolic, grey=pulse
      html+='<div class="legend">'
          + (illSpansFor(chartLog,"ts",win).length?'<span><i style="background:'+illColor(null)+'59"></i>'+esc(I18N.t("ill.legend"))+'</span>':'')
          + '<span><i style="background:'+PAL.series.sys+';border-radius:50%"></i>'+esc(I18N.t("bp.legSys"))+'</span>'
          + '<span><i style="background:'+PAL.series.dia+';border-radius:50%"></i>'+esc(I18N.t("bp.legDia"))+'</span>'
          + '<span><i style="background:'+PAL.series.pulse+';border-radius:50%"></i>'+esc(I18N.t("bp.legPulse"))+'</span>'
          + '</div>'
          + '<div class="stats" style="margin-top:12px">'
          + '<div class="stat"><span class="k">'+esc(I18N.t("bp.latest"))+'</span><span class="v">'+L.sys+'/'+L.dia+'</span></div>'
          + (L.pulse!=null?'<div class="stat"><span class="k">'+esc(I18N.t("bp.pulse"))+'</span><span class="v">'+L.pulse+'</span></div>':'')
          + '<div class="stat"><span class="k">'+esc(I18N.t("bp.when"))+'</span><span class="v" style="font-size:14px">'+esc(fmtDateTime(L.ts))+'</span></div>'
          + '</div>';
      // extra row scoped to the visible day window (range selector active)
      var bs = bpRange.days!=null ? DOMAIN.bpWindowStats(chartLog) : null;
      if(bs){
        function bpTile(key, mm){
          return '<div class="stat"><span class="k">'+esc(I18N.t(key))+'</span><span class="v">'+Math.round(mm.avg)
            +'</span><span class="muted tiny">'+Math.round(mm.min)+'&ndash;'+Math.round(mm.max)+'</span></div>';
        }
        html+='<div class="stats" style="margin-top:8px">'
          + bpTile("bp.winSys", bs.sys) + bpTile("bp.winDia", bs.dia)
          + (bs.pulse?bpTile("bp.winPulse", bs.pulse):'')
          + '</div>';
      }
    }
    html+='</div>';

    // entry form
    var bpCtx0=bpCtxHtml((editing?toLocalDT(editing.ts):nowLocalDT()).slice(0,10));
    html+='<div class="card"><p class="sub">'+esc(I18N.t("bp.sub"))+'</p>'
    + (editing?'<div class="note" style="margin:0 0 12px">'+esc(I18N.t("common.editing"))+'</div>':'')
    + '<div class="row" id="bpCtx" style="margin:0 0 10px'+(bpCtx0?'':';display:none')+'">'+bpCtx0+'</div>'
    + (editing?'':'<div class="seg" data-bpmode>'
        +'<button type="button" data-m="one"'+(series?'':' class="on"')+'>'+esc(I18N.t("bp.modeOne"))+'</button>'
        +'<button type="button" data-m="series"'+(series?' class="on"':'')+'>'+esc(I18N.t("bp.modeSeries"))+'</button></div>')
    + '<div id="bpOne"'+(series?' hidden':'')+'><div class="grid g3">'
    +   '<div class="field"><label>'+esc(I18N.t("bp.sys"))+'</label><input type="number" inputmode="numeric" id="bpSys" placeholder="120" value="'+(editing?esc(editing.sys):'')+'"></div>'
    +   '<div class="field"><label>'+esc(I18N.t("bp.dia"))+'</label><input type="number" inputmode="numeric" id="bpDia" placeholder="80" value="'+(editing?esc(editing.dia):'')+'"></div>'
    +   '<div class="field"><label>'+esc(I18N.t("bp.pulse"))+' <span class="muted tiny">('+esc(I18N.t("common.optional"))+')</span></label><input type="number" inputmode="numeric" id="bpPulse" placeholder="70" value="'+(editing&&editing.pulse!=null?esc(editing.pulse):'')+'"></div>'
    + '</div></div>'
    + (editing?'':'<div id="bpMany"'+(series?'':' hidden')+'>'
        +'<p class="tiny muted" style="margin:-2px 0 10px">'+esc(I18N.t("bp.seriesHint"))+'</p>'
        + bpSeriesHeadHTML() + [1,2,3].map(bpRowHTML).join('')
        +'<div id="bpAvg" class="note" style="margin:2px 0 12px"></div></div>')
    + '<div class="grid g2"><div class="field"><label>'+esc(I18N.t("bp.when"))+' <span class="muted tiny">('+esc(I18N.t("bp.whenHint"))+')</span></label><input type="date" id="bpDate" value="'+(editing?toLocalDT(editing.ts):nowLocalDT()).slice(0,10)+'"></div>'
    + '<div class="field"><label>'+esc(I18N.t("common.time"))+'</label><input type="time" id="bpTime" value="'+(editing?toLocalDT(editing.ts):nowLocalDT()).slice(11,16)+'"></div></div>'
    + '<label class="toggle" style="margin:4px 0 12px"><input type="checkbox" id="bpFast"'+((editing?editing.fasting:morning)?" checked":"")+'><span class="switch"></span><span>'+esc(I18N.t("bp.fasting"))+'</span></label>'
    + '<div class="field"><label>'+esc(I18N.t("common.note"))+' <span class="muted tiny">('+esc(I18N.t("common.optional"))+')</span></label><input type="text" id="bpNote" maxlength="80" value="'+(editing?esc(editing.note||""):'')+'"></div>'
    + '<div class="row"><button class="btn" id="bpAdd">'+esc(editing?I18N.t("common.update"):I18N.t("bp.add"))+'</button>'
    + (editing?'<button class="btn ghost" id="bpCancel">'+esc(I18N.t("common.cancel"))+'</button>':'')
    + '</div>'
    + '<div class="rellinks"><a class="btn ghost" href="#weight">'+icon("weight")+esc(I18N.t("rel.toWeight"))+icon("arrow")+'</a></div>'
    + '</div>';

    // history
    if(log.length){
      // injections-style rows: no header, bold reading, pulse/notes underneath
      html+='<div class="card"><h2>'+esc(I18N.t("bp.history"))+'</h2><div class="scroll"><table><tbody>';
      bpPage=pageClamp(bpPage, log.length);
      pageSlice(log, bpPage).forEach(function(e){
        html+='<tr><td style="width:33%">'+esc(fmtDateTime(e.ts))+' '+dowBadge(String(e.ts).slice(0,10))+injDayMarkersBlock(st, String(e.ts).slice(0,10), e.ts)
            +(e.fasting?'<span class="pill" style="display:inline-block;margin-top:2px;background:var(--brand-t14);color:var(--brand-dk)">'+esc(I18N.t("bp.fastingTag"))+'</span>':'')
            +(e.note?'<span class="muted tiny" style="display:block">'+esc(e.note)+'</span>':'')+'</td>'
            + '<td style="width:20%"><b class="nowrap">'+e.sys+'/'+e.dia+'</b>'
            + (e.pulse!=null?'<br><span class="muted tiny nowrap">'+e.pulse+' bpm</span>':'')
            + (e.readings&&e.readings.length>1?'<br><button type="button" class="chevToggle bpAvgToggle'+(bpOpenId===e.id?' open':'')+'" data-id="'+esc(e.id)+'">'
                +esc(I18N.t("bp.avgOf").replace("{n}",e.readings.length))+icon("chevron")+'</button>':'')+'</td>'
            + '<td style="width:25%">'+doseCell(e)+'</td>'
            + '<td class="num"><button class="btn ghost sm bpEdit" title="'+esc(I18N.t("common.edit"))+'" data-id="'+esc(e.id)+'">'+icon("edit")+'</button> '
            + '<button class="btn ghost sm bpDel" title="'+esc(I18N.t("common.delete"))+'" data-id="'+esc(e.id)+'">'+icon("trash")+'</button></td></tr>';
        if(bpOpenId===e.id && e.readings && e.readings.length>1){
          html+='<tr><td colspan="4" style="padding-top:0"><div class="tiny muted">'
            +e.readings.map(function(r,i){
                return (i+1)+'. '+r.sys+'/'+r.dia+(r.pulse!=null?' &middot; '+r.pulse+' bpm':'');
              }).join('<br>')
            +'</div></td></tr>';
        }
      });
      html+='</tbody></table></div>'+pagerHTML("bpPg", bpPage, log.length)+'</div>';
    }
    app.innerHTML=html;

    $("#bpAdd").addEventListener("click",function(){
      var sys, dia, pulse, readings=null;
      var inSeries = !editing && $("#bpMany") && !$("#bpMany").hidden;
      if(inSeries){
        readings=bpSeriesRows();
        var avg=DOMAIN.bpAverage(readings);
        if(!avg || avg.n<2){ toast(I18N.t("bp.needTwo")); var f1=$("#bpSys1"); if(f1) f1.focus(); return; }
        sys=avg.sys; dia=avg.dia; pulse=avg.pulse;
        readings=readings.filter(function(r){ return r.sys>0 && r.dia>0; });
      } else {
        sys=parseInt($("#bpSys").value,10); dia=parseInt($("#bpDia").value,10);
        if(isNaN(sys)||sys<=0){ $("#bpSys").focus(); return; }
        if(isNaN(dia)||dia<=0){ $("#bpDia").focus(); return; }
        pulse=$("#bpPulse").value===""?null:parseInt($("#bpPulse").value,10);
      }
      var whenVal=$("#bpDate").value ? $("#bpDate").value+"T"+($("#bpTime").value||"12:00") : "";
      var when=whenVal?new Date(whenVal):new Date();
      if(isNaN(when.getTime())) when=new Date();
      var fields={ ts:when.toISOString(), sys:sys, dia:dia,
                   pulse:(pulse==null||isNaN(pulse))?null:pulse, fasting:$("#bpFast").checked,
                   note:($("#bpNote").value||"").trim() };
      if(editing){
        // doseMg (legacy manual field) is left untouched on edit
        // an edited value is no longer the average of the stored series, so the
        // series stops claiming to back it up
        var was=editing.readings?DOMAIN.bpAverage(editing.readings):null;
        if(was && (was.sys!==fields.sys || was.dia!==fields.dia || was.pulse!==fields.pulse)) editing.readings=null;
        editing.ts=fields.ts; editing.sys=fields.sys; editing.dia=fields.dia; editing.pulse=fields.pulse;
        editing.fasting=fields.fasting; editing.note=fields.note;
        bpEdit=null;
      } else {
        fields.id=uid(); fields.doseMg=null;
        if(readings && readings.length>1) fields.readings=readings;
        st.bp.log.push(fields);
      }
      st.bp.log.sort(function(a,b){ return a.ts<b.ts?1:a.ts>b.ts?-1:0; });
      bpPage=0;
      STORE.save(); toast(I18N.t("common.saved")); viewBP();
    });
    // Swaps the two blocks by visibility rather than re-rendering, so switching
    // mode never throws away what is already typed.
    $all('[data-bpmode] button').forEach(function(b){ b.addEventListener("click",function(){
      var on=(b.getAttribute("data-m")==="series");
      st.settings.bpSeries=on; STORE.save();
      $all('[data-bpmode] button').forEach(function(x){ x.classList.toggle("on", x===b); });
      $("#bpOne").hidden=on; $("#bpMany").hidden=!on;
      if(on) bpRefreshAvg();
    });});
    function bpRefreshAvg(){
      var box=$("#bpAvg"); if(!box) return;
      var a=DOMAIN.bpAverage(bpSeriesRows());
      box.innerHTML = (a && a.n>1)
        ? '<b>'+esc(I18N.t("bp.avg"))+': '+a.sys+'/'+a.dia+'</b>'
          +(a.pulse!=null?' &middot; '+a.pulse+' bpm':'')
          +' <span class="muted tiny">'+esc(I18N.t("bp.avgOf").replace("{n}",a.n))+'</span>'
        : '<span class="muted tiny">'+esc(I18N.t("bp.needTwo"))+'</span>';
    }
    $all(".bpS").forEach(function(i){ i.addEventListener("input", bpRefreshAvg); });
    if(series) bpRefreshAvg();
    $all(".bpAvgToggle").forEach(function(b){ b.addEventListener("click",function(){
      var id=b.getAttribute("data-id"); bpOpenId=(bpOpenId===id)?null:id; viewBP();
    });});
    if($("#bpCancel")) $("#bpCancel").addEventListener("click",function(){ bpEdit=null; viewBP(); });
    bindPager("bpPg", function(){return bpPage;}, function(v){bpPage=v;}, viewBP);
    bindRange("bpRg", bpRange, viewBP);
    // backfilling? recompute the dose/week pills for the picked date
    $("#bpDate").addEventListener("input",function(){
      var c=$("#bpCtx"); if(!c) return;
      var h=bpCtxHtml(this.value||todayISO());
      c.innerHTML=h; c.style.display=h?"":"none";
    });
    $all(".bpEdit").forEach(function(b){ b.addEventListener("click",function(){
      bpEdit=b.getAttribute("data-id"); viewBP(); window.scrollTo(0,0);
    });});
    $all(".bpDel").forEach(function(b){ b.addEventListener("click",function(){
      if(!confirm(I18N.t("bp.confirmDel"))) return;
      var id=b.getAttribute("data-id");
      st.bp.log = st.bp.log.filter(function(e){return e.id!==id;});
      if(bpEdit===id) bpEdit=null;
      STORE.save(); viewBP();
    });});
  }

  /* ---- 1-tap wellbeing check-ins (energy / mood / clarity, 1-5) ----
     Dots are a DRAFT: tapping selects (tap again deselects) without saving or
     re-rendering, so composed note text is never lost. Everything commits
     together with the "Save note" button — note alone, dots alone, or both. */
  var STATE_PARAMS=[{key:"energy",icon:"⚡"},{key:"mood",icon:"🙂"},{key:"clarity",icon:"🧠"}];
  var stateDraft={ energy:null, mood:null, clarity:null };
  function stateDraftHasValues(){
    return STATE_PARAMS.some(function(p){ return stateDraft[p.key]!=null; });
  }
  function hasStateVals(e){
    return !!e && STATE_PARAMS.some(function(p){ return e[p.key]!=null; });
  }
  function statePillsHTML(e){
    return STATE_PARAMS.map(function(p){
      var v=e[p.key];
      // the pill's ink follows the pill's own colour, not the brand's
      // same green-to-red ramp as symptom severity, read the other way round
      // (1=bad/red, 5=good/green) — PAL.state's own "best" slot is a theme's
      // cyan accent, not a true green, so it doesn't get reused here.
      var wc=PAL.symSev[5-v];
      return v==null ? '' : '<span class="statepill" style="background:'+wc+';color:'+THEME.pickInk(wc)+'"><span class="pemoji">'+p.icon+'</span>'+v+'</span>';
    }).join('');
  }
  function stateRowsHTML(){
    var h='<div style="margin:0 0 10px"><div style="font-size:14px;font-weight:800;color:var(--ink);margin:0 0 2px">'+esc(I18N.t("state.title"))
      +' <span class="muted tiny" style="font-weight:400">— '+esc(I18N.t("state.hint"))+'</span></div>';
    STATE_PARAMS.forEach(function(p){
      h+='<div class="staterow"><span class="sname">'+p.icon+' '+esc(I18N.t("state."+p.key))+'</span><span class="sdots">';
      for(var v=1; v<=5; v++){
        var wc=PAL.symSev[5-v];   // same ramp as symptom severity, reversed: 1=red, 5=true green
        h+='<button type="button" class="sdot'+(stateDraft[p.key]===v?" on":"")+'" data-sp="'+p.key+'" data-v="'+v
          +'" style="background:'+wc+';color:'+wc+'" aria-label="'+esc(I18N.t("state."+p.key))+' '+v+'/5"></button>';
      }
      h+='</span></div>';
    });
    return h+'</div>';
  }
  function bindStateDots(){
    $all(".sdot").forEach(function(b){ b.addEventListener("click",function(){
      var k=b.getAttribute("data-sp"), v=parseInt(b.getAttribute("data-v"),10);
      stateDraft[k] = (stateDraft[k]===v) ? null : v;   // tap again = deselect
      $all('.sdot[data-sp="'+k+'"]').forEach(function(x){
        x.classList.toggle("on", parseInt(x.getAttribute("data-v"),10)===stateDraft[k]);
      });
    });});
  }

  /* ============ DIARY (free-text journal / log) ============ */
  // Therapy-week context (Mounjaro / TRT) for a given date, counted from the
  // first logged shot of each substance. Empty until a first shot exists.
  function weekTags(st, dateISO){
    var out=[];
    ["mounjaro","trt"].forEach(function(sub){
      var w=DOMAIN.therapyWeek(DOMAIN.firstInjDateFor(st,sub), dateISO);
      if(w==null) return;
      out.push({ label:(sub==="mounjaro"?"MJ":"TRT"), week:w,
                 dose:DOMAIN.lastDoseAsOf(st,sub,dateISO),
                 doseWeek:doseWeekAsOf(st,sub,dateISO), color:PAL.subst[sub] });
    });
    return out;
  }
  // Same notation as the history dose pills: "Mounjaro 2.5 mg t5 · d5"
  function weekPills(tags){
    return tags.map(function(t){
      return '<span class="pill" style="background:'+t.color+PAL.tintA+';color:'+t.color+'">'
        +esc(t.label)
        +(t.dose?' '+esc(doseTxt(t.dose.dose, t.dose.unit, t.dose.every, t.dose.days, t.dose.times, t.dose.perDay)):'')
        +' '+esc(I18N.t("common.weekLetter"))+t.week
        +(t.dose&&t.doseWeek!=null?' &middot; '+esc(I18N.t("common.doseWeekLetter"))+t.doseWeek:'')+'</span>';
    }).join(" ");
  }
  // ---- illness / infection episodes ----
  // Severity 1-3 (mild -> severe). The 🤒 glyph labels every chip, so sharing
  // amber with the peptide pill can't be misread.
  function illColor(sev){ return sev?PAL.sev[sev-1]:PAL.sev[1]; }
  // "🤒 Choroba d3 · angina" — the day number is what makes a run of sick days
  // scannable without opening anything.
  function illPill(ill){
    if(!ill) return "";
    var c=illColor(ill.severity);
    return '<span class="pill illpill" style="background:'+c+PAL.tintA+';color:'+c+'">&#129298; '
      +esc(I18N.t("ill.short"))+' '+esc(I18N.t("common.dayLetter"))+ill.dayN
      +(ill.label?' &middot; '+esc(ill.label):'')+'</span>';
  }
  // Three tap-to-pick severity pills (same idiom as the weight-chart series chips).
  // cls scopes them, so the episode card and the composer can each show a set.
  function illSevHtml(sel, cls){
    var out='<div class="row" style="gap:6px;align-items:center;flex-wrap:wrap">'
      +'<span class="muted tiny" style="font-weight:700">'+esc(I18N.t("ill.severity"))+'</span>';
    for(var v=1;v<=3;v++){
      var c=PAL.sev[v-1], on=(sel===v);
      out+='<button type="button" class="pill '+cls+(on?' on':'')+'" data-v="'+v+'" style="cursor:pointer;border:0;background:'
        +(on?c:'var(--soft)')+';color:'+(on?THEME.pickInk(c):'var(--muted)')+'">'+esc(I18N.t("ill.sev"+v))+'</button>';
    }
    return out+'</div>';
  }
  // Severity pills mutate the draft only — no re-render, so a half-typed note survives.
  function bindIllSev(cls, draft){
    $all("."+cls).forEach(function(b){ b.addEventListener("click", function(){
      var v=parseInt(b.getAttribute("data-v"),10);
      draft.severity = (draft.severity===v)?null:v;
      $all("."+cls).forEach(function(x){
        var xv=parseInt(x.getAttribute("data-v"),10), on=(xv===draft.severity);
        x.classList.toggle("on", on);
        x.style.background = on?PAL.sev[xv-1]:"var(--soft)";
        x.style.color = on?THEME.pickInk(PAL.sev[xv-1]):"var(--muted)";
      });
    });});
  }
  // At most one open illness at a time — refuse instead of silently stacking.
  // Chronic conditions have no such limit: several can run independently.
  // A retrospective episode (endISO given) is born closed, so it never touches
  // that invariant and can be backfilled even while another episode is running.
  function startCondition(type, startISO, endISO, label, severity, symptoms){
    var st=s();
    if(type==="illness" && !endISO && DOMAIN.openIllness(st)){ toast(I18N.t("ill.alreadyOpen")); return false; }
    if(!st.conditions) st.conditions=[];
    st.conditions.push({ id:uid(), type:type, start:startISO,
                      end:endISO ? ((endISO<startISO)?startISO:endISO) : null,
                      label:String(label||"").trim().slice(0,60), severity:severity||null, symptoms:symptoms||[] });
    return true;
  }
  // Closing before the start would make the episode cover nothing — clamp to the start.
  function endCondition(id, endISO){
    var ep=null;
    (s().conditions||[]).forEach(function(e){ if(e.id===id) ep=e; });
    if(!ep){ toast(I18N.t("ill.noneOpen")); return false; }
    ep.end = (endISO<ep.start) ? ep.start : endISO;
    return true;
  }
  // Thin wrappers: the note composer's own "start/end an infection" toggle
  // calls these by name and by illness's single-open-episode assumption.
  function startIllness(startISO, endISO, label, severity){ return startCondition("illness", startISO, endISO, label, severity); }
  function endIllness(endISO){
    var ep=DOMAIN.openIllness(s());
    return ep ? endCondition(ep.id, endISO) : (toast(I18N.t("ill.noneOpen")), false);
  }
  var condCardOpen=false;  // whole "Choroby i schorzenia" card collapsed to one line by default —
                           // most days you're not touching it at all
  var condAddType=null;    // null | "illness" | "chronic" — which "add new" form is open
  var condOpenId=null;     // id of the ONE condition card expanded to its full editor (open or past — same editor)
  var condPage=0;          // past-episode list page
  var condDraft={ severity:null };  // severity pick for whichever form condSeed names
  var symDraft={};  // "<conditionId>:<symptomKey>" -> 1..5, drafted in the composer like stateDraft
  var condSeed=null;
  var condNewSymptoms=[];  // labels typed while composing a brand-new condition, before it is saved
  var condFieldDraft={};   // other fields of the open form, captured across a symptom add/remove re-render
  function condCaptureFields(){
    condFieldDraft = {
      label:($("#condLabel")||{}).value, start:($("#condStart")||{}).value, endNew:($("#condEndNew")||{}).value,
      edLabel:($(".condEdLabel")||{}).value, edStart:($(".condEdStart")||{}).value, edEnd:($(".condEdEnd")||{}).value
    };
  }
  function condRestoreFields(){
    var d=condFieldDraft;
    if($("#condLabel") && d.label) $("#condLabel").value=d.label;
    if($("#condStart") && d.start) $("#condStart").value=d.start;
    if($("#condEndNew") && d.endNew) $("#condEndNew").value=d.endNew;
    if($(".condEdLabel") && d.edLabel) $(".condEdLabel").value=d.edLabel;
    if($(".condEdStart") && d.edStart) $(".condEdStart").value=d.edStart;
    if($(".condEdEnd") && d.edEnd) $(".condEdEnd").value=d.edEnd;
  }
  // Seed the draft once per form identity, so a re-render doesn't undo a
  // deliberate deselect but switching forms doesn't inherit another's pick.
  function condSeedFor(key, sev){
    if(condSeed!==key){ condSeed=key; condDraft.severity=(sev==null?null:sev); }
  }
  var journalEdit=null;  // id of the note being edited (null = composing a new one)
  var journalPage=0;     // notes list page (5 each)
  var symLineOpenId=null; // id of the journal entry whose symptom detail is expanded (one at a time)
  function viewDiary(){
    var st=s(), today=todayISO();
    var editing=null;
    if(journalEdit){
      for(var ji=0;ji<(st.journal||[]).length;ji++){ if(st.journal[ji].id===journalEdit){ editing=st.journal[ji]; break; } }
      if(!editing) journalEdit=null;
    }
    var html=pageHead("diary.title");

    // --- conditions: infections (one open at a time) + chronic conditions and
    // injuries (any number open at once) share one card list. Open conditions
    // expand on tap, same as the old single illness card did; past ones keep
    // their own edit/delete icons so closing one is never more than one tap.
    var condAll=DOMAIN.conditionEpisodes(st);                 // both types, newest start first
    var condOpenList=condAll.filter(function(e){ return !e.end; });
    var condPast=condAll.filter(function(e){ return !!e.end; });
    var condShapedById={};
    DOMAIN.openConditions(st, today).forEach(function(o){ condShapedById[o.id]=o; });
    if(condOpenId && !condAll.some(function(e){ return e.id===condOpenId; })) condOpenId=null;
    if(condAddType==="illness" && DOMAIN.openIllness(st)) condAddType=null;   // started elsewhere meanwhile
    var condEd = condOpenId ? condAll.filter(function(e){ return e.id===condOpenId; })[0] : null;
    if(condEd) condSeedFor("edit:"+condEd.id, condEd.severity);
    else if(condAddType) condSeedFor("new:"+condAddType, null);
    else condSeed=null;

    function condOngoingText(e, sh){
      var c=illColor(e.severity);
      return '<div class="banner" id="condNow" style="margin:0 0 10px;background:'+c+'1a;border-color:'+c+'59;color:'+c+'">'
        +'<b>'+esc(I18N.t(e.type==="illness"?"ill.ongoing":"cond.ongoingChronic"))+'</b> &middot; '+esc(I18N.t("ill.dayN"))+' '+sh.dayN
        +(e.label?' &middot; '+esc(e.label):'')+'</div>';
    }
    // chips: [{label, key?}] — existing symptoms carry a key (remove = archive-or-
    // delete against real history), a brand-new condition's draft entries don't
    // (remove = drop from the in-memory list, nothing saved yet either way).
    function symptomBuilderHTML(chips, removeCls){
      var body=chips.map(function(c){
        return '<span class="pill" style="display:inline-flex;align-items:center;gap:5px;margin:0 6px 6px 0">'
          +esc(c.label)
          +'<button type="button" class="'+removeCls+'"'+(c.key?' data-key="'+esc(c.key)+'"':' data-idx="'+chips.indexOf(c)+'"')
          +' style="border:0;background:none;cursor:pointer;padding:0;line-height:1;color:inherit;font-size:15px" aria-label="'+esc(I18N.t("common.delete"))+'">&times;</button></span>';
      }).join('');
      return '<div class="field"><label class="dayhead" style="margin:16px 0 8px">'+esc(I18N.t("cond.symptoms"))+'</label>'
        + '<div style="margin-bottom:6px">'+(body||'<span class="muted tiny">'+esc(I18N.t("cond.symptomsNone"))+'</span>')+'</div>'
        + '<div class="row"><input type="text" id="condSymInput" maxlength="40" placeholder="'+esc(I18N.t("cond.symptomPh"))+'" style="flex:1;min-width:0">'
        + '<button type="button" class="btn ghost sm" id="condSymAdd">'+esc(I18N.t("cond.symptomAdd"))+'</button></div></div>';
    }
    // Shared editor body for any condition, open or past — the only difference
    // is whether there is still an "end it" action to offer.
    function condEditorHTML(e, sh){
      var labelKey = e.type==="illness" ? "ill.labelPh" : "cond.labelPhChronic";
      // for something still ongoing, ending it is the action you actually come
      // back for — it goes right under the banner, before the fields you only
      // touch when something changes (start/label/severity/symptoms)
      var finishHTML = sh
        ? '<div class="grid g2" style="margin-top:10px"><div class="field"><label>'+esc(I18N.t("ill.endDate"))+'</label><input type="date" id="condEndDate" value="'+esc(today)+'"></div>'
          + '<div class="field" style="display:flex;align-items:flex-end"><button class="btn" id="condFinish" data-id="'+esc(e.id)+'" style="width:100%">'+esc(I18N.t("ill.end"))+'</button></div></div>'
        : '';
      return (sh ? condOngoingText(e, sh) : '')
        + finishHTML
        + '<div class="dayhead" style="margin-top:'+(sh?'16':'2')+'px">'+esc(I18N.t("cond.sectionDetails"))+'</div>'
        + '<div class="field"><label>'+esc(I18N.t("ill.startDate"))+(sh?' <span class="muted tiny">('+esc(I18N.t("ill.startHint"))+')</span>':'')+'</label><input type="date" class="condEdStart" value="'+esc(e.start)+'"></div>'
        + (e.end ? '<div class="field"><label>'+esc(I18N.t("ill.endDate"))+'</label><input type="date" class="condEdEnd" value="'+esc(e.end)+'"></div>' : '')
        + '<div class="field"><label>'+esc(I18N.t("ill.label"))+'</label><input type="text" class="condEdLabel" maxlength="60" placeholder="'+esc(I18N.t(labelKey))+'" value="'+esc(e.label||"")+'"></div>'
        + illSevHtml(condDraft.severity, "condsev")
        + symptomBuilderHTML((e.symptoms||[]).filter(function(sy){ return !sy.archived; }), "condSymDel")
        + '<div class="row" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)"><button class="btn ghost" id="condEdSave" data-id="'+esc(e.id)+'">'+esc(I18N.t(sh?"ill.applyChanges":"ill.update"))+'</button>'
        + '<button class="btn danger" id="condEdDrop" data-id="'+esc(e.id)+'">'+icon("trash")+esc(I18N.t("ill.drop"))+'</button></div>';
    }

    html+='<div class="card"><div class="condCardHead" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">'
      + '<h2 style="margin:0">'+esc(I18N.t("cond.title"))+'</h2>'
      + '<span class="muted" style="padding:0 4px">'+(condCardOpen?'&#9650;':'&#9660;')+'</span></div>';
    if(condCardOpen){
    html+='<div class="row" style="margin-top:10px">'
      + '<button type="button" class="btn ghost" id="condAddIll">&#129298; '+esc(I18N.t("cond.addIllness"))+'</button>'
      + '<button type="button" class="btn ghost" id="condAddChr">&#129657; '+esc(I18N.t("cond.addChronic"))+'</button>'
      + '</div>';
    if(condAddType){
      html+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">'
        + '<p class="sub" style="margin:0 0 8px">'+esc(I18N.t(condAddType==="illness"?"cond.subIllness":"cond.subChronic"))+'</p>'
        + '<div class="grid g2"><div class="field"><label>'+esc(I18N.t("ill.startDate"))+'</label><input type="date" id="condStart" value="'+esc(today)+'"></div>'
        + '<div class="field"><label>'+esc(I18N.t("ill.endDate"))+' <span class="muted tiny">('+esc(I18N.t("ill.endNewHint"))+')</span></label><input type="date" id="condEndNew"></div></div>'
        + '<div class="field"><label>'+esc(I18N.t("ill.label"))+'</label><input type="text" id="condLabel" maxlength="60" placeholder="'+esc(I18N.t(condAddType==="illness"?"ill.labelPh":"cond.labelPhChronic"))+'"></div>'
        + illSevHtml(condDraft.severity, "condsev")
        + symptomBuilderHTML(condNewSymptoms.map(function(lbl){ return {label:lbl}; }), "condSymDelNew")
        + '<div class="row" style="margin-top:10px"><button class="btn" id="condSave">'+esc(I18N.t("ill.save"))+'</button>'
        + '<button class="btn ghost" id="condAddCancel">'+esc(I18N.t("cond.cancel"))+'</button></div>'
        + '</div>';
    }
    // open conditions: tap the row to expand to the full editor, tap it again
    // (the header stays put, chevron flips) to collapse it back — same row,
    // same handler, both directions.
    condOpenList.forEach(function(e){
      var sh=condShapedById[e.id], open=(condOpenId===e.id);
      // collapsed = just enough to say "there is one" — day count, severity
      // and everything else only shows up once you actually tap it open
      html+='<div class="logentry condRow" data-id="'+esc(e.id)+'" style="margin-top:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px">'
        + '<div class="lbody" style="display:flex;align-items:center;gap:8px;min-width:0">'
        + '<span style="font-size:18px;flex:none">'+(e.type==="illness" ? '&#129298;' : '&#129657;')+'</span>'
        + '<span style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
          +esc(e.label||I18N.t(e.type==="illness"?"cond.typeIllness":"cond.typeChronic"))+'</span></div>'
        + '<span class="muted" style="padding:0 8px;flex:none">'+(open?'&#9650;':'&#9660;')+'</span></div>';
      if(open) html+='<div class="logentry"><div class="lbody">'+condEditorHTML(e, sh)+'</div></div>';
    });
    // past (closed) conditions, newest first — dedicated edit/delete icons, no
    // need to expand just to remove one.
    if(condPast.length){
      html+='<h2 style="margin-top:16px">'+esc(I18N.t("ill.past"))+'</h2>';
      condPage=pageClamp(condPage, condPast.length);
      pageSlice(condPast, condPage).forEach(function(e){
        var c=illColor(e.severity), n=daysBetweenISO(e.start, e.end)+1, open=(condOpenId===e.id);
        // the edit icon toggles: tap again on an already-open one to collapse
        // it back, same as the open-conditions row above.
        html+='<div class="logentry"><div class="lbody"><div class="lmeta">'
          + (e.type==="illness" ? '&#129298;' : '&#129657;')+' '
          +'<span class="pill" style="background:'+c+PAL.tintA+';color:'+c+'">'+esc(fmtDate(e.start,true))+' &ndash; '+esc(fmtDate(e.end,true))+'</span>'
          +'<span>'+n+' '+esc(I18N.t(n===1?"ill.day1":"ill.days"))+'</span>'
          +(e.severity?'<span style="color:'+c+';font-weight:700">'+esc(I18N.t("ill.sev"+e.severity))+'</span>':'')
          +'</div>'+(e.label?'<div class="ltext">'+esc(e.label)+'</div>':'')+'</div>'
          +'<button class="btn ghost sm condEdit" title="'+esc(I18N.t("common.edit"))+'" data-id="'+esc(e.id)+'">'+icon("edit")+'</button>'
          +'<button class="btn ghost sm condDel" title="'+esc(I18N.t("common.delete"))+'" data-id="'+esc(e.id)+'">'+icon("trash")+'</button>'
          +'</div>';
        if(open) html+='<div class="logentry"><div class="lbody">'+condEditorHTML(e, null)+'</div></div>';
      });
      html+=pagerHTML("condPg", condPage, condPast.length);
    }
    if(!condOpenList.length && !condPast.length && !condAddType){
      html+='<p class="empty" style="margin-top:10px">'+esc(I18N.t("cond.none"))+'</p>';
    }
    }
    html+='</div>';

    // composer: therapy-week + dose context, textarea, editable timestamp (backfill)
    var whenVal = editing ? toLocalDT(editing.ts) : nowLocalDT();
    function ctxHtml(dISO){
      var tags=weekTags(st, dISO);
      return tags.length ? weekPills(tags) : '<span class="muted tiny">'+esc(I18N.t("diary.ctxNone"))+'</span>';
    }
    // Starting or ending a condition happens on the card above, once, not here
    // every day — the composer's own job is the quick daily check-in for
    // whatever is already open. One block per open condition, symptoms only
    // (no block at all for one with none configured yet).
    function condCheckinHTML(dISO){
      var open=DOMAIN.openConditions(st, dISO);
      var h='';
      open.forEach(function(o){
        var e=null; (st.conditions||[]).forEach(function(c){ if(c.id===o.id) e=c; });
        var active=e?(e.symptoms||[]).filter(function(sy){ return !sy.archived; }):[];
        if(!active.length) return;
        h+='<div style="margin:0 0 10px"><div style="font-size:14px;font-weight:800;color:var(--ink);margin:0 0 2px">'
          +(e.type==="illness"?'&#129298;':'&#129657;')+' '+esc(e.label||I18N.t(e.type==="illness"?"cond.typeIllness":"cond.typeChronic"))+'</div>';
        active.forEach(function(sy){
          h+='<div class="staterow"><span class="sname">'+esc(sy.label)+'</span><span class="sdots">';
          for(var v=1;v<=5;v++){
            // severity runs the opposite way from wellbeing: none (1) is good
            // (green), severe (5) is bad (red) — its own ramp, not the
            // wellbeing one, whose "best" slot is a theme's cyan accent rather
            // than a true green (see symSevRamp).
            var vc=PAL.symSev[v-1], on=(symDraft[e.id+":"+sy.key]===v);
            h+='<button type="button" class="sdot symdot'+(on?" on":"")+'" data-cond="'+esc(e.id)+'" data-sym="'+esc(sy.key)
              +'" data-v="'+v+'" style="background:'+vc+';color:'+vc+'" aria-label="'+esc(sy.label)+' '+v+'/5"></button>';
          }
          h+='</span></div>';
        });
        h+='</div>';
      });
      return h;
    }
    html+='<div class="card"><p class="sub">'+esc(I18N.t("diary.sub"))+'</p>'
      + (editing?'<div class="note" style="margin:0 0 10px">'+esc(I18N.t("diary.editing"))+'</div>':'')
      + '<div class="row" id="jCtx" style="margin:0 0 10px">'+ctxHtml(whenVal.slice(0,10))+'</div>'
      + '<div id="jSym">'+condCheckinHTML(whenVal.slice(0,10))+'</div>'
      + stateRowsHTML()
      + '<div class="field"><textarea id="jText" rows="3" maxlength="2000" placeholder="'+esc(I18N.t("diary.ph"))+'">'+(editing?esc(editing.text):'')+'</textarea></div>'
      + '<div class="grid g2"><div class="field"><label>'+esc(I18N.t("diary.when"))+' <span class="muted tiny">('+esc(I18N.t("diary.whenHint"))+')</span></label><input type="date" id="jDate" value="'+whenVal.slice(0,10)+'"></div>'
      + '<div class="field"><label>'+esc(I18N.t("common.time"))+'</label><input type="time" id="jTime" value="'+whenVal.slice(11,16)+'"></div></div>'
      + '<div class="row"><button class="btn" id="jAdd">'+esc(I18N.t(editing?"diary.update":"diary.add"))+'</button>'
      + (editing?'<button class="btn ghost" id="jCancel">'+esc(I18N.t("common.cancel"))+'</button>':'')
      + '<span class="muted tiny">'+esc(I18N.t("diary.ctrlEnter"))+'</span></div>'
      + '</div>';

    // log list: journal entries (text and/or wellbeing), legacy standalone
    // check-ins and old slider-diary notes, newest first
    var items=(st.journal||[]).map(function(e){ return {id:e.id, key:String(e.ts), ts:e.ts, text:e.text, vals:(hasStateVals(e)?e:null), symptoms:e.symptoms, legacy:false}; });
    (st.stateLog||[]).forEach(function(e){
      items.push({id:e.id, key:String(e.ts), ts:e.ts, state:e, legacy:false});
    });
    (st.dailyLog||[]).forEach(function(e){
      if(e && e.note) items.push({id:e.id, key:e.date+"T12:00", date:e.date, text:e.note, legacy:true});
    });
    items.sort(function(a,b){ return a.key<b.key?1:a.key>b.key?-1:0; });

    html+='<div class="card"><h2>'+esc(I18N.t("diary.list"))+'</h2>';
    if(!items.length){
      html+='<div class="empty">'+esc(I18N.t("diary.empty"))+'</div>';
    } else {
      // entries stay separate, but the list groups them under one day header
      // that carries the day-level context (t/d pills + injection markers) once
      function dayLabel(dISO){
        if(dISO===today) return I18N.t("diary.today");
        if(dISO===addDaysISO(today,-1)) return I18N.t("diary.yesterday");
        return fmtDate(dISO);
      }
      // Collapsed: just which condition(s) this entry touched — "🤒 Grypa"
      // — same "say there's one, don't dump the fields" rule as the condition
      // card rows above. Tap the chevron to expand into a line per condition
      // with a small dot per symptom in its severity colour (same ramp as the
      // composer's tap targets) — a bare "3" or "2" next to two unrelated
      // symptoms reads as ambiguous, the colour makes "how bad" legible at a
      // glance. A condition or symptom that was later deleted outright (never
      // just archived) has nothing left to resolve a label from, so it is
      // silently skipped — the same thing the delete confirmation already
      // promises ("marks disappear from notes").
      function symptomLineHTML(symptoms, entryId){
        if(!symptoms) return '';
        var byCond={};
        Object.keys(symptoms).forEach(function(k){
          var v=symptoms[k]; if(v==null) return;
          var sep=k.indexOf(":"); if(sep<0) return;
          var condId=k.slice(0,sep), symKey=k.slice(sep+1), cond=null;
          (st.conditions||[]).forEach(function(c){ if(c.id===condId) cond=c; });
          if(!cond) return;
          var sym=null; (cond.symptoms||[]).forEach(function(sy){ if(sy.key===symKey) sym=sy; });
          if(!sym) return;
          var dot='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+PAL.symSev[v-1]+';margin-right:4px" aria-hidden="true"></span>';
          (byCond[condId]=byCond[condId]||{cond:cond,parts:[]}).parts.push(dot+esc(sym.label)+' '+v+'/5');
        });
        var ids=Object.keys(byCond);
        if(!ids.length) return '';
        function condLabel(g){ return (g.cond.type==="illness"?'&#129298;':'&#129657;')+' '
          +esc(g.cond.label||I18N.t(g.cond.type==="illness"?"cond.typeIllness":"cond.typeChronic")); }
        var open=(symLineOpenId===entryId);
        var h='<div class="muted tiny" style="margin-top:2px">'
          +ids.map(function(cid){ return condLabel(byCond[cid]); }).join(' &middot; ')
          +' <button type="button" class="chevToggle symLineToggle'+(open?' open':'')+'" data-id="'+esc(entryId)+'">'
          +esc(I18N.t("cond.sectionDetails"))+icon("chevron")+'</button></div>';
        if(open){
          // the condition's own full name is already on the chip line right
          // above — repeating it as a heading per group just doubles that
          // same text. When there's more than one condition in this entry,
          // its icon alone in front of each symptom is enough to tell the
          // groups apart. Each symptom still gets its own line — several
          // dots run together read as one soup, same reasoning as giving
          // each its own colour.
          h+=ids.map(function(cid){
            var g=byCond[cid];
            var prefix=ids.length>1 ? ((g.cond.type==="illness"?'&#129298;':'&#129657;')+' ') : '';
            return g.parts.map(function(p){
              return '<div class="muted tiny" style="margin-top:2px;display:flex;align-items:center">'+prefix+p+'</div>';
            }).join('');
          }).join('');
        }
        return h;
      }
      journalPage=pageClamp(journalPage, items.length);
      var lastDay=null;
      pageSlice(items, journalPage).forEach(function(it){
        var dISO=it.legacy?it.date:String(it.ts).slice(0,10);
        // the illness flag is day-derived, so it lands on every item type
        var ill=DOMAIN.illnessAsOf(st, dISO), ic=ill?illColor(ill.severity):null;
        if(dISO!==lastDay){
          lastDay=dISO;
          html+='<div class="dayhead'+(ill?' ill':'')+'"'
            +(ill?' style="border-bottom-color:'+ic+'66;color:'+ic+'"':'')+'>'
            +'<span>'+esc(dayLabel(dISO))+injDayMarkers(st,dISO)+'</span>'
            +illPill(ill)+weekPills(weekTags(st,dISO))+'</div>';
        }
        // no chip on the entry itself: every page re-renders its day header, so
        // the chip up there plus this rail already carry it without repeating
        var meta=(it.legacy
          ? '<span class="pill" style="background:var(--soft);color:var(--muted)">'+esc(I18N.t("diary.legacyTag"))+'</span>'
          : '<span>'+esc(fmtTime(it.ts))+'</span>');
        var body = it.state ? statePillsHTML(it.state)
          : (it.vals?statePillsHTML(it.vals):'')
            + (it.text ? ((it.vals?'<div style="margin-top:3px">':'')+esc(it.text)+(it.vals?'</div>':'')) : '')
            + symptomLineHTML(it.symptoms, it.id);
        html+='<div class="logentry'+(ill?' ill':'')+'"'
          +(ill?' style="border-left-color:'+ic+';background:linear-gradient(90deg,'+ic+'14,transparent 55%)"':'')
          +'><div class="lbody"><div class="lmeta">'+meta+'</div>'
          +'<div class="ltext">'+body+'</div></div>'
          +(it.legacy?'':(it.state
            ?'<button class="btn ghost sm sDel" title="'+esc(I18N.t("common.delete"))+'" data-id="'+esc(it.id)+'">'+icon("trash")+'</button>'
            :'<button class="btn ghost sm jEdit" title="'+esc(I18N.t("common.edit"))+'" data-id="'+esc(it.id)+'">'+icon("edit")+'</button>'
            +'<button class="btn ghost sm jDel" title="'+esc(I18N.t("common.delete"))+'" data-id="'+esc(it.id)+'">'+icon("trash")+'</button>'))
          +'</div>';
      });
      html+=pagerHTML("jPg", journalPage, items.length);
    }
    html+='</div>';
    html+='<div class="rellinks"><a class="btn ghost" href="#inject">'+icon("inject")+esc(I18N.t("rel.toInject"))+icon("arrow")+'</a></div>';

    app.innerHTML=html;

    function saveNote(){
      // one entry carries the text, the wellbeing dots and the per-condition
      // symptom taps — any of the three is enough on its own
      var txt=($("#jText").value||"").trim();
      var hasState=stateDraftHasValues();
      var hasSym=Object.keys(symDraft).some(function(k){ return symDraft[k]!=null; });
      if(!txt && !hasState && !hasSym){ $("#jText").focus(); return; }
      var wv=$("#jDate").value ? $("#jDate").value+"T"+($("#jTime").value||"12:00") : "";
      var when=wv?new Date(wv):new Date();
      if(isNaN(when.getTime())) when=new Date();
      if(!st.journal) st.journal=[];
      // only symptoms of conditions actually open on the note's own date count —
      // otherwise a dot tapped before backdating the note could attach to a day
      // it was never shown on
      var dISO=when.toISOString().slice(0,10);
      var validKeys={};
      DOMAIN.openConditions(st, dISO).forEach(function(o){
        var e=null; (st.conditions||[]).forEach(function(c){ if(c.id===o.id) e=c; });
        (e&&e.symptoms||[]).forEach(function(sy){ validKeys[e.id+":"+sy.key]=true; });
      });
      var symptoms=null;
      Object.keys(symDraft).forEach(function(k){
        if(symDraft[k]==null || !validKeys[k]) return;
        symptoms = symptoms || {}; symptoms[k]=symDraft[k];
      });
      if(editing){
        editing.text=txt; editing.ts=when.toISOString();
        STATE_PARAMS.forEach(function(p){ editing[p.key]=stateDraft[p.key]; });
        editing.symptoms=symptoms;

  /* ============ INJECTIONS (Mounjaro / TRT / peptides) + abdomen spot map ============ */
  // Identity slots. A preset ships ten of them: two reserved for Mounjaro and
  // TRT, eight offered to peptides — so "no two substances wear the same colour"
  // holds by construction, in every theme.
  var PEP_TONES=["p1","p2","p3","p4","p5","p6","p7","p8"];
  function toneColor(tone){
    if(tone==="brand") return PAL.subst.mounjaro;
    if(tone==="accent") return PAL.subst.trt;
    var i=PEP_TONES.indexOf(tone);
    return i<0 ? null : PAL.pep[i];
  }
  function substColors(){ return PAL.subst; }
  function peptideList(st, withArchived){
    return ((st.inj&&st.inj.peptides)||[]).filter(function(p){ return p && (withArchived || !p.archived); });
  }
  // Archived peptides resolve too: their old injections still need a name and colour.
  function peptideById(st, id){
    var hit=null;
    ((st.inj&&st.inj.peptides)||[]).forEach(function(p){ if(p && p.id===id) hit=p; });
    return hit;
  }
  function substColor(st, sub){
    if(PAL.subst[sub] && sub!=="peptide") return PAL.subst[sub];
    var p=peptideById(st, sub);
    if(!p) return PAL.subst[sub] || PAL.fallback;
    return toneColor(p.tone) || p.color || PAL.fallback;
  }
  // Never fall through to I18N.t for a peptide id — it returns the key itself.
  function substLabel(st, sub){
    var p=peptideById(st, sub);
    if(!p && (sub==="mounjaro" || sub==="trt")) return I18N.t("inj.seg."+sub);
    return p ? p.name : (sub==="peptide" ? I18N.t("inj.seg.peptide") : String(sub||""));
  }
  // The one substance the form and history act on. TRT and Mounjaro are segments
  // of their own; a peptide rides in pepSel under the "peptide" segment. Null
  // means nothing is open yet and the list is the whole screen.
  function selectedSubst(){ return injSeg==="peptide" ? pepSel : injSeg; }
  // Tapping a row only moves that same pair around — the segment/pepSel model is
  // untouched, so the router, the save path and the pen tracker all still read
  // exactly what they read before. Tapping the open row again collapses it.
  function selectSubst(id){
    if(selectedSubst()===id){ injSeg="peptide"; pepSel=null; }
    else if(id==="trt" || (id==="mounjaro" && mjTabOn(s()))){ injSeg=id; pepSel=null; }
    else { injSeg="peptide"; pepSel=id; }
    injEdit=null; injSel=null; injPage=0; injDraft={dose:"",name:"",when:"",sandbag:null};
    syncInjectRoute(); viewInject();
  }
  // Every substance in one list: Mounjaro first while its tab is on (Tirzepatyd
  // then rides that row instead of doubling up as a peptide), then TRT, then the
  // peptides — the same order and the same dedupe rule the dashboard uses.
  function substRows(st){
    var rows=[];
    if(mjTabOn(st)) rows.push("mounjaro");
    rows.push("trt");
    peptideList(st).forEach(function(p){
      if(p.id==="mounjaro" && mjTabOn(st)) return;
      rows.push(p.id);
    });
    // The saved order ranks whatever it knows; anything it does not (a compound
    // added or restored since) falls to the end keeping its natural order, so
    // st.inj.order never has to be complete or pruned.
    var rank={};
    ((st.inj&&st.inj.order)||[]).forEach(function(id,i){ rank[id]=i; });
    var nat={};
    rows.forEach(function(id,i){ nat[id]=i; });
    return rows.slice().sort(function(a,b){
      var ra=(rank[a]!=null)?rank[a]:Infinity, rb=(rank[b]!=null)?rank[b]:Infinity;
      if(ra!==rb) return ra<rb?-1:1;
      return nat[a]-nat[b];
    });
  }
  // Finished compounds, kept out of the list above but never out of the file.
  // Archiving deletes nothing: the record, its injections and its whole vial log
  // stay, so a compound picked up again months later resumes the same history.
  function archivedRows(st){
    var out=[];
    peptideList(st, true).forEach(function(p){
      if(p.archived && !(p.id==="mounjaro" && mjTabOn(st))) out.push(p.id);
    });
    return out;
  }
  // Shots on file for a substance — the WHOLE log, not the visible one: a
  // sandbagged shot is still a shot, and deleting one quietly is the very thing
  // the delete rule below exists to prevent.
  function substShotCount(st, sub){
    return ((st.injLog||[]).filter(function(e){ return e && e.substance===sub; })).length;
  }
  // The only way a compound leaves the file, and it takes nothing with it:
  // deletion is allowed ONLY where there is not one shot on record, so history
  // can never be destroyed from here. Anything with a shot behind it is finished
  // and resumed instead. Tirzepatyd is never deletable at all — its record is
  // wired to st.calc and the optimizer. The gate lives here rather than in the
  // buttons, so no future caller can walk around it.
  function canDeletePep(st, id){
    return !!id && id!=="mounjaro" && !substShotCount(st, id);
  }
  function deletePeptide(st, id){
    if(!canDeletePep(st, id)) return false;
    var list=(st.inj&&st.inj.peptides)||[], i=-1;
    for(var k=0;k<list.length;k++) if(list[k] && list[k].id===id){ i=k; break; }
    if(i<0) return false;
    list.splice(i,1);
    // substRows ignores ids it does not know, so this is tidiness rather than
    // necessity — but a saved order carrying ghosts is a puzzle for the next reader.
    if(st.inj.order) st.inj.order=st.inj.order.filter(function(x){ return x!==id; });
    if(pepSel===id) pepSel=null;
    if(pepEditId===id){ pepEditId=null; pepDraft={}; }
    return true;
  }
  // Moving a row writes back the WHOLE visible order, so a stale saved list
  // repairs itself the first time anything is moved.
  function moveSubst(st, id, dir){
    var rows=substRows(st), i=rows.indexOf(id), j=i+dir;
    if(i<0 || j<0 || j>=rows.length) return false;
    rows.splice(j, 0, rows.splice(i, 1)[0]);
    if(!st.inj) return false;
    st.inj.order=rows;
    return true;
  }
  function enterReorder(){
    injReorder=true; injSeg="peptide"; pepSel=null; pepEditId=null;
    syncInjectRoute(); viewInject();
  }
  // ---- hold to reorder, then drag ----------------------------------------
  // Holding a row switches the list into edit mode and carries straight on into
  // dragging that row, without lifting. The catch: entering edit mode re-renders
  // the whole view, so the node under the finger is destroyed mid-gesture — the
  // row is found again by data-row, and the move/up listeners live on `document`
  // rather than on the element (pointer capture would die with it).
  var HOLD_MS=450, SLOP=10, drag=null, holdT=null;
  function bindRowGestures(st){
    pressMoved=false;
    // Finished compounds are not part of the running order, so holding one must
    // not drag the list about; a plain tap still opens it.
    $all(".peplist:not(.archlist) .pep").forEach(function(row){
      row.addEventListener("pointerdown",function(ev){
        if(ev.button) return;                                   // right-click etc.
        if(ev.target.closest(".pepgrip")){ startDrag(st, row.getAttribute("data-row"), ev); return; }
        if(injReorder) return;                                  // body is inert; drag from the handle
        var id=row.getAttribute("data-row"), x0=ev.clientX, y0=ev.clientY;
        clearTimeout(holdT);
        holdT=setTimeout(function(){
          holdT=null;
          if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
          enterReorder();                                        // re-renders
          startDrag(st, id, { clientX:x0, clientY:y0, pointerId:ev.pointerId });
        }, HOLD_MS);
        function cancel(e){
          if(e && e.type==="pointermove" &&
             Math.abs(e.clientX-x0)<SLOP && Math.abs(e.clientY-y0)<SLOP) return;  // still a hold
          clearTimeout(holdT); holdT=null;
          document.removeEventListener("pointermove",cancel);
          document.removeEventListener("pointerup",cancel);
          document.removeEventListener("pointercancel",cancel);
        }
        document.addEventListener("pointermove",cancel);
        document.addEventListener("pointerup",cancel);
        document.addEventListener("pointercancel",cancel);
      });
    });
    // keyboard path, since the arrows are gone: focus a handle and use up/down
    $all(".pepgrip").forEach(function(g){ g.addEventListener("keydown",function(ev){
      var d=(ev.key==="ArrowUp")?-1:(ev.key==="ArrowDown")?1:0;
      if(!d) return;
      ev.preventDefault();
      if(moveSubst(st, g.getAttribute("data-id"), d)){
        STORE.save(); viewInject();
        var again=$('.pepgrip[data-id="'+g.getAttribute("data-id")+'"]');
        if(again) again.focus();
      }
    });});
  }
  function startDrag(st, id, ev){
    var list=$(".peplist"); if(!list) return;
    var row=$('.pep[data-row="'+id+'"]'); if(!row) return;
    var rows=$all(".peplist .pep");
    drag={ st:st, id:id, row:row, list:list, y0:ev.clientY, from:rows.indexOf(row), to:rows.indexOf(row),
           h:row.getBoundingClientRect().height+9, rows:rows, moved:false };
    row.classList.add("dragging");
    list.classList.add("moving");
    document.addEventListener("pointermove", onDragMove);
    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);
  }
  function onDragMove(ev){
    if(!drag) return;
    ev.preventDefault();
    var dy=ev.clientY-drag.y0;
    if(Math.abs(dy)>3) drag.moved=true;
    drag.row.style.transform="translateY("+dy+"px)";
    // where would it land? one slot per row height crossed
    var to=drag.from+Math.round(dy/drag.h);
    to=Math.max(0, Math.min(drag.rows.length-1, to));
    if(to!==drag.to){
      drag.to=to;
      drag.rows.forEach(function(r,i){
        if(r===drag.row) return;
        var shift=0;
        if(drag.from<to && i>drag.from && i<=to) shift=-drag.h;
        else if(drag.from>to && i>=to && i<drag.from) shift=drag.h;
        r.style.transform=shift?("translateY("+shift+"px)"):"";
      });
    }
  }
  function endDrag(){
    if(!drag) return;
    var d=drag; drag=null;
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", endDrag);
    document.removeEventListener("pointercancel", endDrag);
    d.row.classList.remove("dragging");
    if(d.list) d.list.classList.remove("moving");
    d.rows.forEach(function(r){ r.style.transform=""; });
    pressMoved=d.moved;                       // swallow the click this press ends with
    setTimeout(function(){ pressMoved=false; }, 0);
    if(d.to===d.from) return;
    var order=d.rows.map(function(r){ return r.getAttribute("data-row"); });
    order.splice(d.to, 0, order.splice(d.from, 1)[0]);
    if(d.st.inj){ d.st.inj.order=order; STORE.save(); }
    viewInject();
  }
  // One card per substance: colour rail, name, "dose · interval · cycle", and the
  // countdown on the right. The selected card is the one the form below acts on.
  // Everything resolves from a substance id, so the vial and cycle bits simply
  // fall away for TRT, which has neither.
  function substCardHTML(st, sub){
    var p=peptideById(st, sub);
    var ev=substInterval(st, sub);
    var lastTs=lastInjTs(st,sub);
    var cd=DOMAIN.doseCountdown(lastTs, ev, Date.now(), substDays(st, sub), substTimes(st, sub),
                                substDayCtx(st, sub, lastTs));
    var cyc=(p && p.cycleDays && p.cycleStart) ? DOMAIN.cycleProgress(p, todayISO()) : null;
    var last=DOMAIN.lastDoseAsOf(st, sub);
    var bits=[];
    if(last && last.dose!=null){
      bits.push(esc(String(last.dose)+" "+((p?p.unit:last.unit)||"")));
      var u=p?pepUnits(st, p, last.dose):null;
      if(u!=null) bits.push('<b style="color:'+substColor(st,sub)+'">'+esc(fmtUnits(u)+" "+I18N.t("sch.units"))+'</b>');
    } else if(p){
      // no shot yet: show the mix so the card is not blank
      var c0=pepConcAsOf(st, p);
      if(c0!=null) bits.push(esc(fmtConc(c0)+" "+DOMAIN.vialUnitFor(p.unit)+"/ml"));
    }
    var subDys=substDays(st, sub), subTms=substTimes(st, sub), subPd=substPerDay(st, sub);
    var pdTxt=(subPd>1 && !subTms)?" "+subPd+"\u00d7":"";
    // Named hours say how many a day better than the count does, so they take
    // its place — in either rhythm, since either one picks the days out.
    var rhTxt=subTms?" "+fmtTimes(subTms):pdTxt;
    if(subDys) bits.push(esc(fmtDows(subDys)+rhTxt));
    // A one-day gap is simply "daily" — the same word the weekday plan uses for
    // all seven, and short enough that "2x" beside it no longer wraps the line.
    else if(ev===1) bits.push(esc(I18N.t("inj.schedAllDays")+rhTxt));
    else if(ev!=null) bits.push(esc(I18N.t("inj.pepEvery")+" "+fmtEvery(ev)+" "
      +I18N.t(ev%1?"inj.dayGen":"inj.daysShort")+rhTxt));
    if(cyc) bits.push(esc(I18N.t("inj.cycleShort")+" "+cyc.dayN+"/"+cyc.total));
    var on=(selectedSubst()===sub);
    // Reordering makes the row inert — a nested button is invalid markup, and an
    // inert row means the list cannot scroll out from under the arrows.
    var dueSoon=DOMAIN.dueNow(cd);
    // Two lines, and each one carries something on the right, so the row closes
    // as a rectangle instead of leaving a ragged corner: the moment sits beside
    // the name, the countdown beside the subtitle. Splitting the pair this way
    // also keeps the subtitle wide — the figure ("9h") is far narrower than the
    // moment ("czw. 08:11") that used to reserve the space on both lines.
    var inner='<span class="peptop"><span class="pepname">'+esc(substLabel(st,sub))
        +(dueSoon&&!injReorder?' <span class="duebadge">'+esc(I18N.t("inj.dueBadge"))+'</span>':'')+'</span>'
        +'<span class="pepwhen">'+(cd?esc(fmtNextShot(cd.nextMs)):esc(I18N.t("inj.pepNoShots")))+'</span></span>'
        +'<span class="pepbot"><span class="pepsub">'+bits.join(" &middot; ")+'</span>'
        +'<span class="pepbig">'+(cd?esc(countdownBig(cd)):"&mdash;")+'</span></span>';
    var head = injReorder
      ? '<div class="pepHead">'+inner+'</div>'
        +'<button type="button" class="pepgrip" data-id="'+esc(sub)+'" aria-label="'+esc(I18N.t("pep.dragHandle"))+'"'
        +' title="'+esc(I18N.t("pep.dragHandle"))+'">'+icon("grip")+'</button>'
      : '<button type="button" class="pepHead" data-id="'+esc(sub)+'">'+inner+'</button>';
    // data-row survives as the way back to this element: entering edit mode

  var PEP_UNITS=["mcg","mg","j","IU"];

        +'<span class="row" style="flex:0 0 auto;gap:6px">'

  // Live line under the vial fields: what the mix works out to, and what the
  // last dose would be in syringe units.
  function vialPreviewHTML(st, p, unit, mgOv, mlOv){
    var mg=(mgOv!=null)?mgOv:(p?(pepVialAsOf(st,p)||{}).mg:null);
    var ml=(mlOv!=null)?mlOv:(p?(pepVialAsOf(st,p)||{}).ml:null);
    var conc=DOMAIN.vialConc(mg, ml);
    if(conc==null) return esc(I18N.t("pep.vialNone"));
    var vu=DOMAIN.vialUnitFor(unit);
    var out='= <b>'+esc(fmtConc(conc)+" "+vu+"/ml")+'</b>';
    var last=p?DOMAIN.lastDoseAsOf(st, p.id):null;
    var u=last&&last.dose!=null ? DOMAIN.unitsForDose(last.dose, unit, conc) : null;
    if(u!=null) out+=' &middot; '+esc(String(last.dose)+" "+unit)+' &rarr; <b>'+esc(fmtUnits(u)+" "+I18N.t("sch.units"))+'</b>';

  function pepFormHTML(st){
    var isNew=(pepEditId==="new"), p=isNew?null:peptideById(st, pepEditId);
    if(!isNew && !p) return "";
    var name=isNew?"":(p.name||""), tone=pepDraft.tone||(isNew?nextPepTone(st):p.tone);
    var isBrand=!isNew && p.id==="mounjaro";
    var col=isBrand ? PAL.subst.mounjaro : (toneColor(tone)||(p&&p.color)||PAL.pep[0]);
    var unit=pepDraft.unit||(isNew?"mcg":(p.unit||"j"));
    var every=isNew?1:pepInterval(st,p);
    // Tirzepatyd rides st.calc.intervalDays, which the optimizer plans pens and
    // costs from, so it keeps the fixed-gap rhythm and never offers weekdays.
    var daysOK=isNew || p.id!=="mounjaro";
    var pfDays=(pepDraft.days!==undefined) ? DOMAIN.normDays(pepDraft.days)
                                           : (isNew?null:pepDays(st,p));
    var pfTimes=(pepDraft.times!==undefined) ? DOMAIN.normTimes(pepDraft.times)
                                             : (isNew?null:pepTimes(st,p));
    var pfPerDay=(pepDraft.perDay!==undefined) ? pepDraft.perDay
                                               : (isNew?1:pepPerDay(st,p));
    var cycOn=isNew?false:!!(p.cycleDays && p.cycleStart);
    // Colours worn by another substance are struck through, so two cards can
    // never end up the same colour on the abdomen map. Archived peptides count:
    // their dots and history rows keep their colour. If somehow every colour is
    // taken, none is blocked — a duplicate beats being unable to choose at all.
    var taken={};
    peptideList(st, true).forEach(function(o){ if((!p || o.id!==p.id) && o.tone) taken[o.tone]=true; });
    var free=0;
    PEP_TONES.forEach(function(t){ if(!taken[t]) free++; });
    var sw=PEP_TONES.map(function(t){
      var c=toneColor(t), busy=(free>0) && !!taken[t] && t!==tone;
      return '<button type="button" class="pfCol'+(busy?" taken":"")+'" data-tone="'+t+'"'+(busy?' disabled':'')
        +' style="background-color:'+c+';'+(t===tone?"outline:2px solid var(--ink);outline-offset:2px":"")+'"'
        +' title="'+esc(busy?I18N.t("pep.colorTaken"):c)+'" aria-label="'+esc(busy?I18N.t("pep.colorTaken"):c)+'"></button>';
    }).join("");
    return '<div class="card" style="border-color:'+col+'59">'
      +'<h2 style="margin:0 0 10px">'+esc(I18N.t("inj.pepEditTitle"))+'</h2>'

        +'<input type="text" id="pfName" maxlength="60" value="'+esc(name)+'" placeholder="'+esc(I18N.t("inj.pepNamePh"))+'"></div>'
      +'<div class="field"><label>'+esc(I18N.t("inj.pepColor"))+'</label>'
        +(isBrand?'<p class="tiny muted" style="margin:0"><span style="display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px;background:'+col+'"></span>'+esc(I18N.t("pep.colorBrand"))+'</p>'
                 :'<div class="pfcols">'+sw+'</div>')+'</div>'
      +'<div class="grid g2">'
        +'<div class="field"><label>'+esc(I18N.t("inj.pepUnit"))+'</label><select id="pfUnit">'
          +PEP_UNITS.map(function(u){ return '<option value="'+u+'"'+(u===unit?" selected":"")+'>'+u+'</option>'; }).join("")
        +'</select></div>'
        +(daysOK?'<div class="field"><label>'+esc(I18N.t("inj.schedMode"))+'</label><select id="pfMode">'
          +'<option value="every"'+(pfDays?"":" selected")+'>'+esc(I18N.t("inj.schedEvery"))+'</option>'
          +'<option value="days"'+(pfDays?" selected":"")+'>'+esc(I18N.t("inj.schedDays"))+'</option>'
        +'</select></div>':'')
      +'</div>'
      // Either a gap or a set of days — never both at once, so there is only
      // ever one answer to "when is the next shot".
      +'<div class="field" id="pfEveryBox"'+(pfDays?' style="display:none"':'')+'><label>'+esc(I18N.t("inj.intervalSet"))+'</label>'
        +'<input type="number" inputmode="decimal" id="pfEvery" min="0.5" step="0.5" value="'+every+'"></div>'
      +(daysOK?'<div id="pfDaysBox"'+(pfDays?'':' style="display:none"')+'>'
        +'<div class="field"><label>'+esc(I18N.t("inj.schedPick"))+'</label>'+dowPickHTML("pfDays", pfDays)
          +'<button type="button" class="btn ghost sm" id="pfAllDays" style="margin-top:6px">'
          +esc(I18N.t("inj.schedEveryDay"))+'</button></div>'
        +'</div>':'')
      // Outside both boxes: the hours say when on the days, and both rhythms
      // pick days out — "every 2 days at 20:00" reads as well as "Tue/Thu at

      // field that is actually on screen.
      +(daysOK?'<div class="field"><label>'+esc(I18N.t("inj.schedTimes"))+'</label>'
        +timePickHTML("pfTimes", pfTimes)+'</div>':'')
      // Under the rhythm, because it modifies whichever one is chosen: how many
      // doses land on each of the days that rhythm already picked out.
      +(daysOK?'<div class="field"><label>'+esc(I18N.t("inj.perDay"))+'</label>'+perDayHTML("pfPerDay", pfPerDay)
        +'<p class="tiny muted" style="margin:4px 0 0">'+esc(I18N.t("inj.perDayHint"))+'</p></div>':'')
      +vialSectionHTML(st, isNew?null:p, unit)
      +'<label class="toggle" style="margin:2px 0 8px"><input type="checkbox" id="pfCycleOn"'+(cycOn?" checked":"")+'>'
        +'<span class="switch"></span><span>'+esc(I18N.t("inj.cycleOn"))+'</span></label>'
      +'<div id="pfCycle" class="grid g2"'+(cycOn?"":' style="display:none"')+'>'
        +'<div class="field"><label>'+esc(I18N.t("inj.cycleLen"))+'</label>'
          +'<input type="number" inputmode="numeric" id="pfCycleLen" min="1" value="'+((!isNew&&p.cycleDays)||56)+'"></div>'
        +'<div class="field"><label>'+esc(I18N.t("inj.cycleStart"))+'</label>'
          +'<input type="date" id="pfCycleStart" value="'+esc((!isNew&&p.cycleStart)||"")+'"></div>'
      +'</div>'
      +'<div class="row" style="margin-top:6px"><button class="btn" id="pfSave">'+esc(I18N.t("common.save"))+'</button>'
      +'<button class="btn ghost" id="pfCancel">'+esc(I18N.t("common.cancel"))+'</button>'
      +(isNew?'':'<button class="btn ghost" id="pfDel">'
        +esc(I18N.t(canDeletePep(st, p.id)?"inj.pepDelete":"inj.pepArchive"))+'</button>')
      +'</div></div>';
  }
  function bindPeptides(st){

      // collapse whatever was open so the form does not jump under a moving list

      injReorder=false; viewInject();
