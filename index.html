    +'</div>'
    +'<div style="margin-top:14px"><button class="btn danger" id="setClear">'+esc(I18N.t("set.clear"))+'</button></div>'
    +'</div>'
    // the only tool here is the Mounjaro clicks calculator, so with that tab off
    // the card was rendering as a bare heading with nothing under it
    +(mjTabOn(st)?'<div class="card"><h2>'+esc(I18N.t("set.tools"))+'</h2>'
      +'<a class="btn ghost" href="#optimizer">'+icon("calc")+esc(I18N.t("opt.title"))+icon("arrow")+'</a></div>':'')
    +'<div class="card"><h2>'+esc(I18N.t("set.privacy"))+'</h2><p class="small muted">'+esc(I18N.t("set.privacyTxt"))+'</p></div>';
    app.innerHTML=html;

    $("#setLang").addEventListener("change",function(){
      st.settings.lang=this.value; I18N.setLang(this.value); STORE.save();
      document.documentElement.lang=this.value; applyStatic(); render();
    });
    $("#setCur").addEventListener("change",function(){ st.settings.currency=(this.value||"PLN").toUpperCase(); STORE.save(); renderPenCosts(pcMode); });
    $("#setH").addEventListener("input",function(){ st.profile.heightCm=this.value===""?null:parseFloat(this.value); STORE.save(); });
    $("#setAge").addEventListener("input",function(){ st.profile.age=this.value===""?null:parseInt(this.value,10); STORE.save(); });
    $("#setSex").addEventListener("change",function(){ st.profile.sex=this.value||null; STORE.save(); });
    $("#setMjTab").addEventListener("change",function(){ st.settings.showMounjaroTab=this.checked; STORE.save(); render(); });
    $("#setDoseWeeks").addEventListener("change",function(){ st.settings.showDoseWeeks=this.checked; STORE.save(); });
    $("#setDoseBf").addEventListener("change",function(){ st.settings.showDoseBackfill=this.checked; STORE.save(); });
    // repaint immediately: flipping this hides/reveals sandbagged injections everywhere
    $("#setSandbag").addEventListener("change",function(){ st.settings.sandbagging=this.checked; STORE.save(); render(); });
    // Pen-costs card: Home (settings.penCosts) vs Destination (settings.travel.penCosts + currency)
    var pcMode="home";
    function renderPenCosts(mode){
      pcMode=mode;
      var dest=(mode==="dest"), costs=dest?st.settings.travel.penCosts:st.settings.penCosts;
      var cur=dest?(st.settings.travel.currency||""):st.settings.currency;
      var h=dest ? '<p class="sub">'+esc(I18N.t("set.pcDestHint"))+'</p>'
                     +'<div class="field" style="max-width:220px"><label>'+esc(I18N.t("trv.destCur"))+'</label>'+currencyInput("pcDestCur",st.settings.travel.currency)+'</div>'
                 : '<p class="sub">'+esc(I18N.t("set.penCostsHint"))+'</p>';
      var curTag=cur?'<span class="cur">'+esc(cur)+'</span>':'';
      h+='<div class="pcgrid">'+STRENGTHS.map(function(v){
        var pc=costs?costs[String(v)]:null;
        return '<div class="pcitem"><label><span>'+v+' mg</span>'+curTag+'</label><input type="number" inputmode="decimal" class="penCost" data-v="'+v+'" value="'+(pc!=null?pc:"")+'" placeholder="'+esc(cur)+'"></div>';
      }).join("")+'</div>';
      $("#pcBody").innerHTML=h;
      $all(".penCost").forEach(function(inp){
        inp.addEventListener("input",function(){
          var store=dest?st.settings.travel.penCosts:st.settings.penCosts;
          store[inp.getAttribute("data-v")] = inp.value===""?null:parseFloat(inp.value);
          STORE.save();
        });
      });
      var dc=$("#pcDestCur"); if(dc) dc.addEventListener("change",function(){ st.settings.travel.currency=(this.value||"").toUpperCase(); STORE.save(); renderPenCosts("dest"); });
    }
    $all("#pcSeg button").forEach(function(b){
      b.addEventListener("click",function(){
        $all("#pcSeg button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on"); renderPenCosts(b.getAttribute("data-pc"));
      });

    renderPenCosts("home");
    $("#setFxAuto").addEventListener("change",function(){
      if(this.checked){
        if(!confirm(I18N.t("fx.consent"))){ this.checked=false; return; }
        st.settings.fxAuto=true; STORE.save();
        fetchFx(st.settings.currency,function(err){ if(err) toast(I18N.t("fx.error")); render(); });
        render();
      } else { st.settings.fxAuto=false; STORE.save(); render(); }
    });
    var fxr=$("#setFxRefresh"); if(fxr) fxr.addEventListener("click",function(){
      fetchFx(st.settings.currency,function(err){ if(err) toast(I18N.t("fx.error")); render(); });
    });
    $("#setExport").addEventListener("click",function(){ STORE.exportFile(); });
    $("#setImportBtn").addEventListener("click",function(){ $("#setImport").click(); });
    $("#setImport").addEventListener("change",function(){
      if(!this.files||!this.files[0]) return;
      STORE.importFile(this.files[0],function(ok){
        if(ok){ I18N.setLang(STORE.state.settings.lang); document.documentElement.lang=STORE.state.settings.lang;
          applyTheme(); applyStatic(); updateBanner(); toast(I18N.t("set.importOk")); render(); }
        else toast(I18N.t("set.importErr"));
      });
    });
    if($("#setInstall")) $("#setInstall").addEventListener("click",function(){ doInstall($("#installBtn")); });
    $all(".themecard").forEach(function(b){ b.addEventListener("click",function(){
      setTheme(b.getAttribute("data-theme"));
    });});
    $("#setClear").addEventListener("click",function(){
      if(!confirm(I18N.t("set.clearConfirm"))) return;
      STORE.clearAll(); I18N.setLang(STORE.state.settings.lang); document.documentElement.lang=STORE.state.settings.lang;
      applyTheme(); applyStatic(); render();
    });
    bindLinkCard();
  }

  /* ---- router & static text ---- */
  var routes={ pulpit:viewDash, inject:viewInject, weight:viewWeight, bp:viewBP, diary:viewDiary, correlate:viewCorrelate, optimizer:viewOpt, settings:viewSettings };
  function currentTab(){
    var t=DOMAIN.parseRoute(location.hash).tab;
    return routes[t]?t:"pulpit";
  }
  // The sub-state segment of the address names ONE substance, so a dashboard row
  // can open the injections view with that substance already picked. Called from
  // the router only: views re-run themselves on every keystroke-driven change, and
  // re-seeding from the address there would wipe a half-typed form.
  function applyRoute(tab, sub){
    if(tab!=="inject" || !sub) return;
    var st=s(), seg=null, pep=null;
    if(sub==="trt") seg="trt";
    else if(sub==="peptides") seg="peptide";   // plural: the card list. "peptide" is a legacy peptide id
    else if(sub==="mounjaro" && mjTabOn(st)) seg="mounjaro";
    else if(peptideById(st, sub)){ seg="peptide"; pep=sub; }   // covers Tirzepatyd when the tab is off
    else return;
    if(seg===injSeg && pep===pepSel) return;                   // already there
    injSeg=seg; pepSel=pep;
    injSel=null; injEdit=null; injPage=0; pepEditId=null;
    injDraft={dose:"",name:"",when:"",sandbag:null};
  }
  // Substance picked inside the view -> address, without a new history entry, so
  // "back" from a dashboard row returns to the dashboard instead of stepping
  // through every substance the user glanced at.
  function injectSub(st){
    if(injSeg!=="peptide") return injSeg;
    if(!pepSel) return "peptides";
    return (pepSel==="mounjaro" && mjTabOn(st)) ? "peptides" : pepSel;   // "mounjaro" would reopen the tab
  }
  function syncInjectRoute(){
    var h=DOMAIN.buildRoute("inject", injectSub(s()));
    if(location.hash===h) return;
    // keep this entry's position stamp — replacing it with null would make the
    // entry look brand new on the way back
    try{ history.replaceState(history.state,"",h); }catch(e){ return; }   // file:// forbids it; the address just stays put
  }
  // The arrows call history.back/forward, so the browser's own stack does the
  // navigating; this only answers "is either end live", which the browser will
  // not tell us.
  //
  // Direction cannot be inferred from the hash: opening a view you were on
  // before looks exactly like pressing Back, so a mirrored stack decrements
  // where the browser actually pushed, and from that point on the two disagree
  // for good. Instead each history entry carries its own position — the browser
  // stores that per entry and keeps it across reloads — and the furthest
  // position reached lives in sessionStorage, which survives a reload in the
  // same tab.
  var NAV_MAX_KEY="mounyaro.navmax";
  var navPos=0, navMax=0, navSeen=false;
  function navMaxStored(){
    try{ var v=parseInt(sessionStorage.getItem(NAV_MAX_KEY),10); return v>0?v:0; }catch(e){ return 0; }
  }
  function trackNav(){
    var hs=history.state, pos=(hs && typeof hs.mjNav==="number") ? hs.mjNav : null;
    if(pos===null){
      // unstamped: the browser just pushed this entry, which also dropped
      // whatever used to sit ahead of it
      pos = navSeen ? navPos+1 : 0;
      navMax = pos;
      try{ history.replaceState({mjNav:pos},""); }catch(e){}
    } else if(!navSeen){
      navMax = Math.max(navMaxStored(), pos);   // first paint of a reloaded document
    }
    navPos=pos; navSeen=true;
    try{ sessionStorage.setItem(NAV_MAX_KEY, String(navMax)); }catch(e){}
  }
  function canBack(){ return navPos>0; }
  function canFwd(){ return navPos<navMax; }
  function render(){
    var r=DOMAIN.parseRoute(location.hash), tab=routes[r.tab]?r.tab:"pulpit";
    trackNav();
    applyRoute(tab, r.sub);
    $all("nav.tabs a").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-tab")===tab); });
    routes[tab]();
    window.scrollTo(0,0);
  }
  function applyStatic(){
    $all("[data-i]").forEach(function(n){ n.textContent=I18N.t(n.getAttribute("data-i")); });
    $("#footer").textContent=I18N.t("footer.disclaimer");
    $all("#langSwitch button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===I18N.lang); });
  }
  var linkBannerOn=false;
  function updateBanner(){
    var b=$("#storeBanner");
    b.style.cursor=""; b.onclick=null;
    if(STORE.memoryOnly){ b.textContent=I18N.t("set.noStore"); b.classList.remove("hidden"); return; }
    if(linkBannerOn){
      b.textContent=I18N.t("set.linkBanner"); b.style.cursor="pointer"; b.classList.remove("hidden");
      b.onclick=function(){ STORE.reconnect(function(st2){
        if(st2==="loaded"||st2==="kept-local"){ linkBannerOn=false; updateBanner();
          I18N.setLang(STORE.state.settings.lang); document.documentElement.lang=STORE.state.settings.lang;
          applyTheme(); applyStatic(); render(); }
      }); };
      return;
    }
    b.classList.add("hidden");
  }
  function setTheme(id){
    STORE.state.settings.theme=id;
    if(THEME.resolve(id).dark) STORE.state.settings.lastDark=id;
    STORE.save(); applyTheme(); render();
  }
  function applyTheme(){
    var t=THEME.apply(STORE.state.settings.theme);
    rebuildDerived();
    var btn=$("#themeBtn"); if(btn) btn.textContent = t.dark?"☀️":"🌙";
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t.dark?t.bg:t.brand);
  }

  // PWA install: capture the deferred prompt (Android/Chromium) and surface a
  // visible Install button; on iOS Safari there's no prompt, so show how-to.
  var deferredInstall=null;
  // Running as an installed app? Cover every installed display mode plus the
  // android-app:// referrer, and re-check at event time — some Android
  // browsers fire beforeinstallprompt even inside the installed window.
  // Chrome keeps offering the install prompt in a normal tab even when the app is
  // already installed, and there is no reliable way to ask. So remember: the first
  // time the app is seen running as an installed app (or reports being installed),
  // note it and stop offering. The installed app and the browser tab share this
  // origin's storage, so seeing it once in the app settles it for the tab too.
  var INSTALLED_KEY="mounyaro.installed";
  function installedBefore(){
    try{ return localStorage.getItem(INSTALLED_KEY)==="1"; }catch(e){ return false; }
  }
  function rememberInstalled(){
    try{ localStorage.setItem(INSTALLED_KEY,"1"); }catch(e){}
  }
  function isStandaloneNow(){
    try{
      if(navigator.standalone===true) return true;   // iOS home-screen app
      if(window.matchMedia){
        if(window.matchMedia("(display-mode: standalone)").matches) return true;
        if(window.matchMedia("(display-mode: fullscreen)").matches) return true;
        if(window.matchMedia("(display-mode: minimal-ui)").matches) return true;
      }
      if(document.referrer && document.referrer.indexOf("android-app://")===0) return true;
    }catch(e){}
    return false;
  }
  function isIOSDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent||""); }
  function doInstall(btn){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function(){ deferredInstall=null; if(btn) btn.hidden=true; render(); });
    } else alert(I18N.t("install.ios"));
  }
  function setupInstall(){
    var btn=$("#installBtn"); if(!btn) return;
    var isIOS=isIOSDevice();
    if(isStandaloneNow()){ rememberInstalled(); btn.hidden=true; }
    else if(isIOS && !installedBefore()){ btn.hidden=false; }
    window.addEventListener("beforeinstallprompt",function(e){
      e.preventDefault();
      deferredInstall=e;                             // kept: Settings can still offer it
      if(isStandaloneNow() || installedBefore()) return;
      btn.hidden=false;
    });
    window.addEventListener("appinstalled",function(){
      deferredInstall=null; rememberInstalled(); btn.hidden=true;
    });
    btn.addEventListener("click",function(){ doInstall(btn); });
  }
  function init(){
    app=$("#app");
    ensureCurrencyList();
    // language
    I18N.setLang(STORE.state.settings.lang||"pl");
    document.documentElement.lang=I18N.lang;
    applyTheme();
    applyStatic(); updateBanner();
    setupInstall();
    $("#themeBtn").addEventListener("click",function(){
      var cur=THEME.resolve(STORE.state.settings.theme);
      setTheme(cur.dark ? "mounyaroLight" : (STORE.state.settings.lastDark || "mounyaroDark"));
    });
    // lang switch buttons
    $all("#langSwitch button").forEach(function(btn){
      btn.addEventListener("click",function(){
        var l=btn.getAttribute("data-lang");
        STORE.state.settings.lang=l; I18N.setLang(l); STORE.save();
        document.documentElement.lang=l; applyStatic(); render();
      });
    });
    window.addEventListener("hashchange",render);
    // Delegated: the arrows are rebuilt by every self-render of a view, so there
    // is nothing stable to attach a listener to.
    app.addEventListener("click",function(ev){
      var b=ev.target.closest?ev.target.closest(".navbtn"):null;
      if(!b || b.disabled) return;
      if(b.id==="navBack") history.back();
      else if(b.id==="navFwd") history.forward();
    });
    // When the tab becomes visible/focused again, re-read the linked file: a
    // cloud sync (MEGA/Dropbox) may have pulled in a newer copy while we were
    // away, and the File System Access handle is otherwise only read at startup.
    function refreshLinked(){
      if(document.visibilityState!=="visible") return;
      STORE.refreshFromHandle(function(status){
        if(status==="loaded"){
          I18N.setLang(STORE.state.settings.lang); document.documentElement.lang=STORE.state.settings.lang;
          applyTheme(); applyStatic(); render();
        } else if(status==="needsPermission"){
          linkBannerOn=true; updateBanner();
        }
      });
    }
    document.addEventListener("visibilitychange",refreshLinked);
    window.addEventListener("focus",refreshLinked);
    if(!location.hash) location.hash="#pulpit";
    render();
    // Restore a previously linked file (async; Chromium only). May pull in newer data.
    STORE.restoreLink(function(status){
      if(status==="loaded"){
        I18N.setLang(STORE.state.settings.lang); document.documentElement.lang=STORE.state.settings.lang;
        applyTheme(); applyStatic(); render();
      } else if(status==="needsPermission"){
        linkBannerOn=true; updateBanner();
      }
    });
  }
  return { init:init };
})();

/* ===== bootstrap ===== */
STORE.load();
UI.init();

/* PWA: register the service worker only when served over http(s) (not file://).
   Auto-update: when a new version is deployed, the new SW (which calls
   skipWaiting + clients.claim) takes control and we reload once so an
   already-open app shows the fresh version without the user tapping refresh.
   We only reload if a SW was already controlling the page (so the very first
   install on a fresh visit doesn't trigger a needless reload). */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  if(navigator.serviceWorker.controller){
    var __reloading=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(__reloading) return; __reloading=true; window.location.reload();
    });
  }
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      // Proactively look for a new deploy: on focus/return to the tab and hourly.
      function checkUpdate(){ if(reg && reg.update) reg.update()["catch"](function(){}); }
      window.addEventListener("focus",checkUpdate);
      document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") checkUpdate(); });
      setInterval(checkUpdate, 60*60*1000);
    })["catch"](function(){ /* offline mode unavailable; app still works */ });
  });
}
</script>
